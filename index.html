<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬북이 키우기</title>
<!-- 아이패드 홈 화면에 앱처럼 추가할 수 있게 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e889a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="꼬북이">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --ink: #4e3f48; --muted: #9a8790; --accent: #e889a8; --line: #f3dde4; --card: #ffffffd0;
  }
  * { box-sizing: border-box; }

  /* 스크롤 없이 한 화면에 게임 전체가 보이는 배치 */
  html, body { height: 100%; }
  body {
    margin: 0; background: linear-gradient(#fdf3f5, #f8e6ec); color: var(--ink); overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: 12px 16px;
  }
  .app {
    height: 100%; max-width: 1280px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px;
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* 머리: 왼쪽 제목, 오른쪽 동그란 버튼들 */
  header { gap: 12px; }
  header > div:first-child { min-width: 0; }
  h1 { white-space: nowrap; }
  .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .round {
    width: 38px; height: 38px; border: none; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(200,120,150,.15);
    font-size: 17px; cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--ink); font-family: inherit; position: relative;
  }
  .round:hover { background: #fff6f9; }
  .round.off { opacity: .45; }
  #moreBtn { font-size: 20px; font-weight: 800; letter-spacing: -1px; }
  #moreBtn.warn::after { content: ""; position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: #f2994a; border: 2px solid #fff; }
  .coin-pill { height: 38px; display: flex; align-items: center; gap: 6px; font-size: 15px !important; padding: 0 14px !important; }
  .more { position: relative; }
  .more-menu {
    position: absolute; right: 0; top: 46px; z-index: 30; min-width: 200px; background: #fff; border-radius: 16px; padding: 8px;
    box-shadow: 0 10px 30px rgba(120,60,90,.2); display: flex; flex-direction: column; gap: 4px;
  }
  .more-menu[hidden] { display: none; }
  .more-menu button { border: none; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .more-menu button:hover { background: #fff6f9; }
  .more-menu #resetBtn { color: #c0566f; }
  .more-menu #releaseBtn { color: #2f7fb0; }
  .more-menu button[hidden] { display: none; }
  .save-row { font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 2px; line-height: 1.4; }
  .save-row.bad { color: #e5554f; }
  @media (max-width: 520px) { .sub { display: none; } .round { width: 34px; height: 34px; } .coin-pill { height: 34px; } }

  /* 거북이 고르기 탭 */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }   /* 거북이가 많으면 두 줄로 */
  .tabs button {
    border: none; background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(200,120,150,.12); white-space: nowrap; display: flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .tabs .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .tabs .warn { color: #e5554f; font-weight: 700; }
  .tabs button.on .warn { color: #fff3a0; }
  .tabs button.add { background: transparent; box-shadow: none; border: 2px dashed #e9b9c9; color: var(--accent); }

  /* 3D 장면 */
  .scene { position: relative; min-height: 0; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(200,120,150,.18); border: 3px solid #fff; touch-action: none; user-select: none; }
  .scene canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .scene canvas.hover { cursor: pointer; }
  .tag {
    position: absolute; transform: translate(-50%, 0); font-size: 11px; padding: 1px 8px; border-radius: 999px;
    background: #ffffffb0; color: #7a6570; white-space: nowrap; pointer-events: none;
  }
  .tag.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 2px 8px rgba(200,120,150,.25); }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); background: #fff; border-radius: 14px; padding: 6px 12px; font-size: 13px;
    white-space: nowrap; box-shadow: 0 4px 14px rgba(200,120,150,.22); pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble.show { opacity: 1; }
  .zzz { position: absolute; font-weight: 700; color: #c9c2ff; pointer-events: none; font-size: 15px; }
  .floaty { position: absolute; font-size: 22px; pointer-events: none; transform: translate(-50%, -50%); animation: float-up 1.4s ease-out forwards; }
  @keyframes float-up { from { margin-top: 0; opacity: 1; } to { margin-top: -70px; opacity: 0; } }
  .hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #8d7a83; background: #ffffffa0; padding: 3px 8px; border-radius: 8px; pointer-events: none; }
  .game-bubble {
    position: absolute; bottom: -60px; width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #fff, rgba(160, 220, 255, .55) 45%, rgba(90, 170, 230, .35));
    border: 2px solid rgba(255,255,255,.9); animation: rise linear forwards;
  }
  @keyframes rise { to { transform: translateY(-600px); } }
  .game-hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); padding: 4px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; display: none; white-space: nowrap; }

  /* 상태와 버튼 */
  .panel { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { background: var(--card); backdrop-filter: blur(6px); border-radius: 20px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(200,120,150,.12); }
  .info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .info b { font-size: 16px; }
  #petName { cursor: pointer; border-bottom: 1px dashed var(--muted); }
  #stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .stat { font-size: 11px; color: #7a6570; }
  .stat .top { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .stat .top span:last-child { font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: #f6e6ec; border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 8px; transition: width .5s, background .5s; }

  .actions { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .coin-pill { background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 14px; box-shadow: 0 3px 10px rgba(200,120,150,.15); white-space: nowrap; }
  .coin-pill.bump { animation: bump .4s; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  /* 상점 */
  .shop-dialog { max-width: 440px !important; text-align: left !important; }
  .shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .shop-head h2 { margin: 0 !important; }
  .shop-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .overlay .shop-tabs button { background: #f6e9ee; color: var(--ink); padding: 7px 11px; font-size: 13px; white-space: nowrap; }
  .overlay .shop-tabs button.on { background: var(--accent); color: #fff; }
  .shop-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; padding-right: 4px; margin-bottom: 12px; }
  .shop-item { display: flex; align-items: center; gap: 10px; background: #fff6f9; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .shop-item .big { font-size: 28px; }
  .shop-item .txt { flex: 1; min-width: 0; }
  .shop-item .txt b { display: block; font-size: 15px; }
  .shop-item .txt small { color: var(--muted); font-size: 12px; }
  .overlay .shop-item button { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  .overlay .shop-item button.sub { background: #9fd8f2; }
  .overlay .shop-item button:disabled { opacity: .45; cursor: default; }
  .shop-item .own { font-size: 12px; color: #5d8a52; font-weight: 700; white-space: nowrap; }
  .season[hidden] { display: none; }
  /* 💊 약 상자 */
  .diagnosis { background: #f2f8fc; border: 2px solid #cfe6f3; border-radius: 14px; padding: 10px 12px; margin: 6px 0 12px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .diagnosis small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .med-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .overlay .med-list button { background: #fff6f9; color: var(--ink); border: 2px solid var(--line); padding: 10px 6px; font-size: 13px; }
  .overlay .med-list button .e { display: block; font-size: 28px; }
  .overlay .med-list button:hover { border-color: var(--accent); }
  .med-empty { grid-column: 1 / -1; color: var(--muted); font-size: 14px; padding: 10px; }
  /* 🍳 부엌 */
  .kitchen { max-width: 420px !important; }
  .kitchen [hidden] { display: none !important; }
  .k-step { font-weight: 700; color: var(--ink) !important; margin: 10px 0 6px !important; text-align: left; }
  .k-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 190px; overflow-y: auto; }
  .overlay .k-grid button { background: #fff6f9; color: var(--ink); border: 2px solid var(--line); padding: 6px 2px; font-size: 12px; font-weight: 600; border-radius: 12px; }
  .overlay .k-grid button .e { display: block; font-size: 24px; }
  .overlay .k-grid button.on { border-color: var(--accent); background: #ffe4ee; }
  .overlay .k-grid button.bag { background: #fff8e6; }
  .k-pot { min-height: 56px; margin: 10px 0 0; border-radius: 0 0 40px 40px; background: linear-gradient(#e2d4c8, #c9b8a8); display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 30px; color: #8f7f72; }
  .k-pot:empty::before { content: "재료를 넣어 주세요"; font-size: 13px; }
  .k-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .overlay .k-methods button { background: #f6e9ee; color: var(--ink); padding: 10px 4px; font-size: 13px; }
  .overlay .k-methods button .e { display: block; font-size: 26px; }
  .overlay .k-methods button.on { background: var(--accent); color: #fff; }
  .overlay #kStart:disabled { opacity: .45; cursor: default; }
  .k-steps { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
  .k-steps span { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #f3e8ed; color: #9a8790; }
  .k-steps span.on { background: var(--accent); color: #fff; font-weight: 700; }
  .k-steps span.done { background: #e3f3dd; color: #5d8a52; }
  .k-instr { font-weight: 700; color: var(--ink) !important; min-height: 40px; margin: 6px 0 8px !important; }
  .k-stage { position: relative; height: 250px; border-radius: 16px; overflow: hidden; background: linear-gradient(#fffaf5, #f3e3d6); touch-action: none; user-select: none; }
  .k-item { position: absolute; transform: translate(-50%, -50%); font-size: 46px; line-height: 1; cursor: pointer; transition: filter .3s; white-space: nowrap; }
  .k-item.huge { font-size: 90px; }
  .k-item.small { font-size: 24px; cursor: default; }
  .k-item.mini { font-size: 22px; pointer-events: none; }
  .k-item.knife { font-size: 44px; pointer-events: none; transform: translate(-50%, -50%) rotate(-30deg); }
  .k-item.knife.chop { animation: chop .25s; }
  @keyframes chop { 50% { transform: translate(-50%, -10%) rotate(-65deg); } }
  .k-item.clean { filter: drop-shadow(0 0 10px #fff27a) saturate(1.3); }
  .k-item.pile { cursor: grab; font-size: 30px; }
  .k-item.huge.pile { font-size: 80px; }
  .k-item.wob { animation: jiggle .35s; }
  .k-item.flip { animation: flip .5s; }
  @keyframes flip { 50% { transform: translate(-50%, -110%) rotateX(180deg); } }
  .k-bar { position: absolute; transform: translateX(-50%); width: 56px; height: 7px; background: #e8dbd2; border-radius: 4px; overflow: hidden; }
  .k-bar i { display: block; height: 100%; width: 0; background: #7fcf9a; transition: width .1s; }
  .k-water { position: absolute; transform: translateX(-50%); width: 34px; height: 80px; border-radius: 10px;
    background: repeating-linear-gradient(transparent 0 8px, rgba(120,190,240,.55) 8px 14px); animation: fall .35s linear infinite; }
  @keyframes fall { to { background-position: 0 14px; } }
  .k-board { position: absolute; transform: translate(-50%, -50%); width: 210px; height: 110px; background: #d9b483; border-radius: 18px; box-shadow: inset 0 -6px 0 #c49a66; }
  .k-puff { position: absolute; transform: translate(-50%, -50%); font-size: 20px; pointer-events: none; animation: float-up .9s ease-out forwards; }
  .k-heat { position: absolute; transform: translateX(-50%); width: 80%; height: 18px; border-radius: 10px; background: linear-gradient(90deg, #9fd8f2 0 45%, #ffd36e 45% 80%, #f27a6a 80%); }
  .k-heat b { position: absolute; top: -5px; width: 7px; height: 28px; background: #4e3f48; border-radius: 3px; transform: translateX(-50%); }
  .k-btn { position: absolute; transform: translate(-50%, -50%); }
  .overlay .k-btn button { padding: 10px 24px; font-size: 18px; }
  .overlay .shaker button { background: #fff; color: var(--ink); font-size: 30px; padding: 6px 14px; border: 2px solid var(--line); }
  .shaker small { display: block; font-size: 11px; font-weight: 600; }
  .k-pan { font-size: 40px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; }
  .k-pan .tool { font-size: 70px; }
  .k-pan .ing { display: inline-block; transition: transform .15s; }
  .k-pan.jiggle .ing { animation: jiggle .3s; }
  @keyframes jiggle { 25% { transform: translateY(-14px) rotate(-15deg); } 75% { transform: translateY(-6px) rotate(15deg); } }
  .overlay .k-tap { font-size: 22px; padding: 14px 34px; animation: pulse 1s infinite; }
  .k-dish { font-size: 80px; animation: pop .5s; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.2); } to { transform: scale(1); } }
  .k-dish-name { font-size: 22px; font-weight: 800; color: var(--ink) !important; margin: 4px 0 !important; }
  .egg-hint { font-size: 12px; color: #a0607a; background: #fff3f7; border-radius: 10px; padding: 4px 10px; margin: 0 0 6px; }
  .egg-hint[hidden] { display: none; }
  .season {
    position: absolute; top: 10px; left: 12px; z-index: 5; background: rgba(255,255,255,.9); border-radius: 999px;
    padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--ink); box-shadow: 0 3px 10px rgba(200,120,150,.15); pointer-events: none;
  }
  .trip-banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.92); padding: 6px 8px 6px 14px; border-radius: 999px; box-shadow: 0 4px 14px rgba(120,60,90,.18);
    font-size: 13px; font-weight: 700; white-space: nowrap; max-width: calc(100% - 20px); overflow-x: auto;
  }
  .trip-banner[hidden], .act-tap[hidden], .act-menu[hidden] { display: none; }
  .trip-banner, .act-menu, .act-tap { z-index: 10; }
  .act-menu {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.96); padding: 10px; border-radius: 16px; box-shadow: 0 8px 22px rgba(120,60,90,.2); min-width: 190px;
  }
  .act-menu button { border: 2px solid var(--line); background: #fff6f9; border-radius: 12px; padding: 9px 12px; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; font-family: inherit; text-align: left; }
  .act-menu button:hover:not(:disabled) { border-color: var(--accent); }
  .act-menu button:disabled { opacity: .55; cursor: default; }
  .trip-banner button { border: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; background: #f6e9ee; color: var(--ink); }
  .trip-banner #actBtn { background: var(--accent); color: #fff; }
  .trip-banner #actBtn:disabled { background: #e9f5e4; color: #5d8a52; cursor: default; }
  .act-tap {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); border: none; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; padding: 14px 30px; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 22px rgba(232,137,168,.45); animation: pulse 1s infinite;
  }
  .act-tap:active { transform: translateX(-50%) scale(.94); }
  @keyframes pulse { 50% { box-shadow: 0 8px 30px rgba(232,137,168,.75); } }
  .me-too { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 0 12px; cursor: pointer; }
  .me-too input { width: 20px; height: 20px; accent-color: var(--accent); }
  .trip-list { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 14px; }
  .overlay .trip-list button { display: flex; justify-content: space-between; align-items: center; background: #fff6f9; color: var(--ink); border: 2px solid var(--line); padding: 11px 14px; font-size: 15px; }
  .overlay .trip-list button:hover { border-color: var(--accent); }
  .trip-list small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mates-label { margin: 4px 0 6px !important; font-weight: 700; color: var(--ink) !important; font-size: 13px !important; }
  .mates { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .overlay .mates button { background: #f6e9ee; color: var(--ink); padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .overlay .mates button.on { background: var(--accent); color: #fff; }
  .overlay .mates button:disabled { opacity: .5; cursor: default; }
  .mates small { font-weight: 400; font-size: 11px; }
  .actions button, .food button {
    border: none; border-radius: 16px; background: #fff; padding: 8px 2px; font-size: 12px; color: #7a5a6a; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 12px rgba(200,120,150,.13); font-family: inherit;
  }
  .actions button .ic { display: block; font-size: 20px; margin-bottom: 1px; }
  .actions button:active, .food button:active { transform: scale(.95); }
  .actions button:hover, .food button:hover { background: #fff6f9; }
  .actions button:disabled { opacity: .45; cursor: default; }
  /* 먹이 메뉴 자리는 항상 비워 둬서, 열고 닫아도 섬 화면 크기가 변하지 않아요 */
  .food { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; visibility: hidden; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; }
  .food button { flex: 0 0 auto; min-width: 104px; padding: 8px 10px; }
  .food button.bag { background: #fff8e6; }
  .food.open { visibility: visible; opacity: 1; transform: none; }
  .food button small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; }
  .log { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }

  /* 넓은 화면: 섬은 왼쪽에 크게, 상태와 버튼은 오른쪽 */
  @media (min-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto auto minmax(0, 1fr); }
    header, .tabs { grid-column: 1 / -1; }
    .scene { grid-row: 3; grid-column: 1; }
    .panel { grid-row: 3; grid-column: 2; }
    .card { padding: 16px 18px; }
    .info { flex-direction: column; gap: 2px; margin-bottom: 10px; }
    .info b { font-size: 20px; }
    #stats { grid-template-columns: 1fr; gap: 10px; }
    .stat { font-size: 13px; }
    .bar { height: 9px; }
    .actions { grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px; font-size: 14px; }
    .actions button .ic { display: inline; margin: 0; font-size: 20px; }
    /* 가로 모드: 작은 상자 3개씩 나란히 (스크롤 없이) */
    .food { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow: visible; }
    .food button { min-width: 0; padding: 6px 2px; font-size: 12px; text-align: center; line-height: 1.3; }

  $('season').textContent = `${s.emoji} ${s.name} · ${d.getMonth() + 1}월 ${d.getDate()}일 (${day}) · ${ampm} ${h12}:${String(d.getMinutes()).padStart(2, '0')}`;

// 여행지: 다녀오는 시간(분), 엽서, 기념품
const TRIPS = {
  beach:   { name: '바닷가',     emoji: '🏖️', mins: 3,  card: '파도 소리가 시원해요! 모래성도 쌓았어요.',      gift: 'shell',   giftName: '조개껍데기' },
  flower:  { name: '꽃마을',     emoji: '🌸', mins: 4,  card: '꽃향기가 가득해요. 나비 친구를 만났어요!',      gift: 'bouquet', giftName: '꽃다발' },
  forest:  { name: '숲속 캠핑',  emoji: '🌲', mins: 5,  card: '모닥불 옆에서 별을 봤어요. 반짝반짝!',         gift: 'pinecone', giftName: '솔방울' },
  snow:    { name: '눈 덮인 산', emoji: '🏔️', mins: 8,  card: '눈사람을 만들었어요! 조금 추워요… 🥶',         gift: 'crystal', giftName: '눈 결정' },
  rainbow: { name: '무지개 폭포', emoji: '🌈', mins: 10, card: '폭포에 무지개가 떴어요! 소원도 빌었어요.',      gift: 'rainbow', giftName: '무지개 돌' },
};
const onTrip = t => !!t.trip;
const awayNow = t => !!t.trip && Date.now() >= t.trip.leave;   // 인사하고 섬을 떠난 뒤   // 예전 저장 데이터(sick: true) 호환
const NAMES = ['꼬북이', '느림보', '초롱이', '토실이', '거북선', '몽실이', '단단이', '뽀송이', '도토리', '콩이', '별이', '바다'];

// 거북이 한 마리의 기본값. 나중에 새 항목을 추가하면 여기에도 넣어 주면
// 예전 저장 데이터를 불러올 때 빠진 값이 자동으로 채워져요.
const TURTLE_DEFAULTS = {
  name: '꼬북이', color: 'green', hatched: false, eggTime: 0, age: 0,
  hunger: 70, happy: 80, clean: 100, energy: 90, health: 100,
  sick: false, asleep: false, nextPoop: null, px: null, pz: null, dir: 0,
  gender: null,        // 'female' | 'male' (예전 거북이는 불러올 때 정해 줘요)
  layCooldown: 300,    // 다음 알을 낳을 수 있을 때까지 남은 시간(초)
  mom: null,           // 엄마 거북이 이름
  trip: null,          // 여행 중이면 { place, group, leave, found, done }
  wear: null,          // 입고 있는 옷 (상점에서 산 것)

};
const SETTINGS_DEFAULTS = { music: true, sfx: true };

const $ = id => document.getElementById(id);
const clamp = v => Math.max(0, Math.min(100, v));
const rand = (a, b) => a + Math.random() * (b - a);
function josa(word, withBatchim, without) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return word + without;
  return word + ((c - 0xAC00) % 28 ? withBatchim : without);
}

let game = null;     // 저장되는 데이터
const rt = {};       // 화면용 데이터 (거북이 id별: 3D 모델, 이름표, 말풍선, 걷기 상태)
let busy = false;    // 미니게임 중
let chosenColor = 'green';

// =====================================================================
// 3D 장면
// =====================================================================
const sceneEl = $('scene');
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const DAY_BG = new THREE.Color('#fbe4ea'), NIGHT_BG = new THREE.Color('#3d3a5e');
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(DAY_BG.clone(), 22, 40);
const camera = new THREE.PerspectiveCamera(34, 1, .1, 100);
camera.position.set(0, 8.4, 11.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, .4);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.5;
controls.maxDistance = 22;
controls.minPolarAngle = .35;
controls.maxPolarAngle = 1.2;

// 화면을 돌리거나 확대한 뒤 가만히 두면, 거북이들이 다 보이게 카메라가 알아서 다가가요
const AUTO_CAM_DELAY = 4000;
let lastCamTouch = 0;
controls.addEventListener('start', () => lastCamTouch = performance.now());
controls.addEventListener('end', () => lastCamTouch = performance.now());
const camSph = new THREE.Spherical(), camOff = new THREE.Vector3(), camCenter = new THREE.Vector3();
function autoFrame(dt) {
  const pts = game.turtles.filter(shownNow).map(t => rt[t.id] && rt[t.id].root.position).filter(Boolean);
  if (viewTrip) treasures.forEach(m => pts.push(m.position));   // 여행지에선 보물도 화면에 들어오게
  if (viewRoom) game.turtles.slice(0, BED_SPOTS.length).forEach((t, i) => pts.push(new THREE.Vector3(BED_SPOTS[i][0], 0, BED_SPOTS[i][1])));   // 침실은 침대가 다 보이게
  if (!pts.length) return;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  pts.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
  camCenter.set((minX + maxX) / 2, .3, (minZ + maxZ) / 2);
  // 거북이들을 감싸는 원 (이름표·말풍선 자리까지 여유를 둬요)
  const radius = Math.max(2.4, ...pts.map(p => Math.hypot(p.x - camCenter.x, p.z - camCenter.z) + 1.3));
  const halfV = camera.fov * DEG / 2, halfH = Math.atan(Math.tan(halfV) * camera.aspect);
  const dist = Math.min(18, Math.max(5, radius / Math.sin(Math.min(halfV, halfH))));
  const k = 1 - Math.exp(-dt * 1.2);   // 부드럽게
  controls.target.lerp(camCenter, k);
  camOff.subVectors(camera.position, controls.target);
  camSph.setFromVector3(camOff);
  camSph.radius += (dist - camSph.radius) * k;
  camSph.phi += (.92 - camSph.phi) * k;     // 보기 좋은 기울기로 (돌린 방향은 그대로)
  camera.position.copy(controls.target).add(camOff.setFromSpherical(camSph));
}

const hemi = new THREE.HemisphereLight('#ffffff', '#f3c6d4', 1.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3e6', 2.2);
sun.position.set(5, 11, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);

{

  const cols = [], gp = geo.attributes.position, gA = new THREE.Color('#bfe4a6'), gB = new THREE.Color('#a8d892'), gC = new THREE.Color('#cfeab5');
  for (let i = 0; i < gp.count; i++) {

    const nz = Math.sin(x * 1.3 + Math.cos(y * .9)) * .5 + Math.sin(y * 1.7 - x * .6) * .5;
    const c = gA.clone().lerp(nz > 0 ? gB : gC, Math.min(1, Math.abs(nz) * .9));
    cols.push(c.r, c.g, c.b);

  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const grass = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95 }));
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = .002;

const mush = (x, z, sc) => {

  stem.position.y = .17;

    const d = new THREE.Mesh(new THREE.SphereGeometry(.045, 12, 12), clay('#fff'));
    d.position.set(dx, dy - .04, dz);
    m.add(d);
  });
  m.position.set(x, 0, z);
  m.scale.setScalar(sc);
  OBSTACLES.push({ x, z, r: .4 * sc });

};

function destFree(d, x, z, rad) {

// 거북이가 갈 수 있는 곳인지
function freeSpot(x, z, rad) {
  if (Math.hypot(x, z) > R - .8) return false;
  if (Math.hypot((x - POND.x) / 1.2, z - POND.z) < POND.r + .5) return false;
  return OBSTACLES.every(o => Math.hypot(x - o.x, z - o.z) > o.r + rad);
}
function nearestFree(x, z, rad) {
  if (freeSpot(x, z, rad)) return [x, z];
  for (let r = .2; r < 8; r += .2) {
    for (let a = 0; a < 16; a++) {
      const nx = x + Math.cos(a / 16 * Math.PI * 2) * r, nz = z + Math.sin(a / 16 * Math.PI * 2) * r;
      if (freeSpot(nx, nz, rad)) return [nx, nz];
    }
  }
  return [0, 0];
}
function randomFree(rad) {
  for (let k = 0; k < 60; k++) {
    const x = (Math.random() - .5) * 2 * (R - 1), z = (Math.random() - .5) * 2 * (R - 1);
    if (freeSpot(x, z, rad)) return [x, z];
  }
  return [0, 0];
}

// 지금 보고 있는 곳(섬 또는 여행지) 기준으로 갈 수 있는 곳
let viewTrip = null, viewDest = null;   // 나도 같이 간 여행 (group id, 여행지)
const areaFree = (x, z, rad) => viewDest ? destFree(viewDest, x, z, rad) : freeSpot(x, z, rad);
const areaR = () => viewDest ? DEST_R - .3 : R - .8;
function areaRandom(rad) {
  if (!viewDest) return randomFree(rad);
  for (let k = 0; k < 60; k++) {
    const x = (Math.random() - .5) * 2 * DEST_R, z = (Math.random() - .5) * 2 * DEST_R;
    if (areaFree(x, z, rad)) return [x, z];
  }
  return [0, 2.5];
}
function areaNearest(x, z, rad) {
  if (!viewDest) return nearestFree(x, z, rad);
  if (areaFree(x, z, rad)) return [x, z];
  for (let r = .2; r < 8; r += .2) {
    for (let a = 0; a < 16; a++) {
      const nx = x + Math.cos(a / 16 * Math.PI * 2) * r, nz = z + Math.sin(a / 16 * Math.PI * 2) * r;
      if (areaFree(nx, nz, rad)) return [nx, nz];
    }
  }
  return [0, 2.5];
}

// 동글동글 아기 거북 등딱지: 꼭대기 1장, 둘레 6장, 가장자리 12장의 큼직한 판
const SCUTES = [];
const addScute = (lat, lon, kind) => SCUTES.push({
  d: new THREE.Vector3(Math.cos(lat * DEG) * Math.cos(lon * DEG), Math.sin(lat * DEG), Math.cos(lat * DEG) * Math.sin(lon * DEG)), kind,
});
addScute(90, 0, 0);
for (let k = 0; k < 6; k++) addScute(48, k * 60 + 30, 1);
for (let k = 0; k < 12; k++) addScute(6, k * 30 + 15, 2);

// 색깔별 등껍질 모양은 한 번만 계산해서 같이 써요
const shellCache = {};
function shellGeometry(colorKey) {
  if (shellCache[colorKey]) return shellCache[colorKey];
  const c = PALETTES[colorKey] || PALETTES.green;
  const geo = new THREE.SphereGeometry(1, 144, 72, 0, Math.PI * 2, 0, Math.PI * .56);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const base = new THREE.Color(c.shell), light = new THREE.Color(c.plate);
  const seam = new THREE.Color(c.rim).multiplyScalar(.5), edge = new THREE.Color(c.rim);
  const tones = SCUTES.map((s, i) => {
    const h = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
    return (s.kind === 2 ? edge.clone().lerp(base, .4) : base.clone()).offsetHSL(0, 0, (h - .5) * .07);
  });
  const ss = THREE.MathUtils.smoothstep;
  const n = new THREE.Vector3(), col = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    n.fromBufferAttribute(pos, i).normalize();
    let d1 = 9, d2 = 9, k1 = 0;
    for (let k = 0; k < SCUTES.length; k++) {
      const d = Math.acos(Math.min(1, n.dot(SCUTES[k].d)));
      if (d < d1) { d2 = d1; d1 = d; k1 = k; } else if (d < d2) d2 = d;
    }
    const e = d2 - d1;                    // 판 경계까지의 거리
    const puff = ss(e, 0, .14);           // 경계(홈)는 0, 판 안쪽은 1
    const center = 1 - ss(d1, 0, .24);    // 판 가운데는 밝게
    const ring = (Math.sin(e * 115) * .5 + .5) * ss(e, .03, .12);   // 나이테 무늬
    col.copy(tones[k1]).lerp(light, center * .5);
    col.multiplyScalar(1 - ring * .06);
    col.lerp(seam, 1 - ss(e, 0, .03));
    cols[i * 3] = col.r; cols[i * 3 + 1] = col.g; cols[i * 3 + 2] = col.b;
    const r = 1 + puff * .08;
    let { x, y, z } = n;
    if (y < 0) { const f = 1 + (-y) * .7; x *= f; z *= f; y *= .25; }
    pos.setXYZ(i, x * r, y * r, z * r);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  return (shellCache[colorKey] = geo);
}

function makeTurtle(colorKey) {
  const c = PALETTES[colorKey] || PALETTES.green;
  const g = new THREE.Group();
  const skinMats = [];
  const skin = () => { const m = clay(c.skin); skinMats.push(m); return m; };
  // 동글동글 아기 거북: 높고 둥근 등껍질 + 큰 머리 + 반짝이는 큰 눈 + 짧은 다리
  const shell = new THREE.Mesh(shellGeometry(colorKey), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .85 }));
  shell.scale.set(1, .95, .95);
  shell.position.y = .32;
  const belly = new THREE.Mesh(new THREE.CylinderGeometry(.92, .82, .26, 64), clay('#fff0c4'));
  belly.position.y = .22;
  g.add(shell, belly);
  const HEAD = { x: 1.25, y: .95 };
  const head = new THREE.Group();
  head.position.set(HEAD.x, HEAD.y, 0);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(.62, 48, 36), skin());
  skull.scale.set(1, .92, 1);
  head.add(skull);
  const eyes = [];
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.13, 20, 16), new THREE.MeshStandardMaterial({ color: '#1d1d1d', roughness: .15 }));
    eye.position.set(.5, .1, s * .27);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(.043, 10, 8), new THREE.MeshBasicMaterial({ color: '#fff' }));
    hl.position.set(.1, .05, 0);
    const hl2 = new THREE.Mesh(new THREE.SphereGeometry(.021, 8, 6), new THREE.MeshBasicMaterial({ color: '#fff' }));
    hl2.position.set(.11, -.045, s * .04);
    eye.add(hl, hl2);
    head.add(eye);
    eyes.push(eye);
    const ch = new THREE.Mesh(new THREE.SphereGeometry(.1, 12, 12), clay('#f7a3b5'));
    ch.scale.set(1, .5, 1);
    ch.position.set(.46, -.12, s * .38);
    head.add(ch);
  });
  // 입 (기분에 따라 웃거나 시무룩)
  const mouthPivot = new THREE.Group();
  mouthPivot.position.set(.6, -.12, 0);
  mouthPivot.rotation.y = Math.PI / 2;
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.07, .016, 8, 20, Math.PI), new THREE.MeshStandardMaterial({ color: '#5a4048', roughness: .6 }));
  mouthPivot.add(mouth);
  head.add(mouthPivot);
  // 안경 (지금은 안 써요)
  const glasses = new THREE.Group();
  const gm = new THREE.MeshStandardMaterial({ color: '#6b5a4a', roughness: .5 });
  [-1, 1].forEach(s => {
    const lens = new THREE.Mesh(new THREE.TorusGeometry(.18, .02, 8, 28), gm);
    lens.rotation.y = Math.PI / 2;
    lens.position.set(.56, .1, s * .27);
    glasses.add(lens);
  });
  const bridge = new THREE.Mesh(new THREE.CylinderGeometry(.016, .016, .2, 6), gm);
  bridge.rotation.x = Math.PI / 2;
  bridge.position.set(.6, .14, 0);
  glasses.add(bridge);
  glasses.visible = false;
  head.add(glasses);
  g.add(head);
  const LEG_Y = .14;
  const legs = [];
  [[.55, .62], [.55, -.62], [-.55, .6], [-.55, -.6]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.SphereGeometry(.26, 24, 16), skin());
    leg.scale.set(1, .75, 1);
    leg.position.set(x, LEG_Y, z);
    g.add(leg);
    legs.push(leg);
  });
  const tail = new THREE.Mesh(new THREE.SphereGeometry(.12, 16, 12), skin());
  tail.position.set(-1.0, .22, 0);
  g.add(tail);
  return { g: shadows(g), head, eyes, legs, mouth, glasses, skinMats, skinColor: new THREE.Color(c.skin),
           headX: HEAD.x, headY: HEAD.y, legY: LEG_Y };
}

function makeEgg(colorKey) {
  const c = PALETTES[colorKey] || PALETTES.green;
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.SphereGeometry(.7, 48, 32), clay('#fbf3df'));
  shell.scale.set(1, 1.3, 1);
  shell.position.y = .9;
  g.add(shell);
  [[.4, 1.2, .45], [-.5, .8, .3], [.1, .6, -.6], [-.2, 1.5, -.3], [.55, .7, -.2]].forEach(([x, y, z]) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(.14, 16, 12), clay(c.plate));
    const n = new THREE.Vector3(x, (y - .9) / 1.3, z).normalize();
    s.position.set(n.x * .7, n.y * .91 + .9, n.z * .7);
    s.scale.set(1, 1, .35);
    s.lookAt(s.position.clone().add(n));
    g.add(s);
  });
  const nest = new THREE.Mesh(new THREE.TorusGeometry(.6, .18, 12, 32), clay('#e2c79b'));
  nest.rotation.x = Math.PI / 2;
  nest.position.y = .1;
  g.add(nest);
  return { g: shadows(g), egg: true };
}

// 나이: 게임 속 10분 = 1살, 1살 전에는 개월로 (50초 = 1개월)
const YEAR_SECS = 600;
function ageLabel(t) {
  if (t.age >= YEAR_SECS) return `${Math.floor(t.age / YEAR_SECS)}살`;
  const months = Math.floor(t.age / (YEAR_SECS / 12));
  return months ? `${months}개월` : '갓 태어남';
}

function stageOf(t) {
  if (!t.hatched) return { id: 'egg',   name: '알',        size: .3 };
  if (t.age < 300)  return { id: 'baby',  name: '아기 거북', size: .28 };
  if (t.age < 1200) return { id: 'child', name: '어린 거북', size: .38 };
  if (t.age < 3600) return { id: 'adult', name: '어른 거북', size: .48 };
  return { id: 'elder', name: '큰 거북', size: .55 };
}

const pickables = [];
function buildModel(t) {
  const r = rt[t.id];
  if (r.model) r.root.remove(r.model.g);
  if (r.hit) { r.root.remove(r.hit); pickables.splice(pickables.indexOf(r.hit), 1); }
  r.model = t.hatched ? makeTurtle(t.color) : makeEgg(t.color);
  r.root.add(r.model.g);
  // 누르기 쉽게 보이지 않는 큰 판정 공
  r.hit = new THREE.Mesh(new THREE.SphereGeometry(t.hatched ? 1.7 : 1.3, 12, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  r.hit.position.y = .6;
  r.hit.userData.id = t.id;
  r.root.add(r.hit);
  pickables.push(r.hit);
  r.hatched = t.hatched;
  applyWear(t);   // 입고 있던 옷
}

function createPet(t) {
  if (t.px == null || !freeSpot(t.px, t.pz, .3)) [t.px, t.pz] = randomFree(.5);
  const root = new THREE.Group();
  root.position.set(t.px, 0, t.pz);
  root.rotation.y = t.dir || Math.random() * Math.PI * 2;
  const size = stageOf(t).size;
  root.scale.setScalar(size);
  scene.add(root);
  const tag = document.createElement('div');
  tag.className = 'tag';
  sceneEl.appendChild(tag);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  sceneEl.appendChild(bubble);
  rt[t.id] = { root, tag, bubble, size, say: 0, cool: 0, target: null, wait: rand(1, 4), hop: 0, drag: false, phase: Math.random() * 10 };
  buildModel(t);
}

function removePet(id) {
  const r = rt[id];
  if (!r) return;
  scene.remove(r.root);
  pickables.splice(pickables.indexOf(r.hit), 1);
  r.tag.remove();
  r.bubble.remove();
  delete rt[id];
}

function emptyGame(settings) {
  return { turtles: [], cur: null, poops: [], nextId: 1, lastSaved: Date.now(), memorial: [], souvenirs: [], coins: 30, owned: [], bag: {}, settings: { ...SETTINGS_DEFAULTS, ...settings } };
}
const randomGender = () => Math.random() < .5 ? 'female' : 'male';
function newTurtle(name, color, gender = randomGender()) {
  const [px, pz] = randomFree(.5);
  return { ...TURTLE_DEFAULTS, id: game.nextId++, name, color, gender, px, pz };
}
const cur = () => game && game.turtles.find(t => t.id === game.cur);

// 저장 데이터 정리: 빠진 값 채우기 (코드가 바뀌어도 이어서 할 수 있게)
function normalize(g) {
  if (!g || typeof g !== 'object') return null;
  const out = emptyGame(g.settings);
  out.turtles = (Array.isArray(g.turtles) ? g.turtles : []).map(t => ({ ...TURTLE_DEFAULTS, ...t }));
  out.turtles.forEach(t => { if (!t.gender) t.gender = randomGender(); });
  out.memorial = Array.isArray(g.memorial) ? g.memorial : [];
  out.souvenirs = Array.isArray(g.souvenirs) ? g.souvenirs : [];
  out.coins = typeof g.coins === 'number' ? g.coins : 30;   // 상점이 생기기 전 데이터는 30코인으로 시작
  out.owned = Array.isArray(g.owned) ? g.owned : [];
  out.bag = g.bag && typeof g.bag === 'object' ? g.bag : {};
  // 예전 2D 응가(숫자)는 섬 위 빈자리로 옮겨요
  out.poops = (Array.isArray(g.poops) ? g.poops : []).map(p => {
    if (p && typeof p === 'object') return p;
    const [x, z] = randomFree(.3);
    return { x, z };
  });
  out.nextId = Math.max(g.nextId || 1, ...out.turtles.map(t => t.id + 1));
  out.cur = g.cur;
  out.lastSaved = g.lastSaved || Date.now();
  return out;
}

// 내 컴퓨터(서버)에서 열면 save.json에도 저장하고, 인터넷(아이패드)에서 열면 그 기기 안에만 저장해요
const useServer = ['localhost', '127.0.0.1'].includes(location.hostname);
function setSaveState(ok, serverDown = false) {
  const el = $('saveState');
  // 저장 상태는 ⋯ 메뉴 안에 보여 주고, 문제가 있으면 ⋯ 버튼에 주황 점
  el.textContent = !ok ? '⚠️ 저장이 안 되고 있어요. "게임 시작.bat"으로 열어 주세요.'
    : serverDown ? '💾 서버가 꺼져 있어서 브라우저에 저장 중이에요. 서버를 다시 켜면 이어서 할 수 있어요.'
    : useServer ? '💾 자동 저장 중이에요 (save.json + 브라우저)' : '💾 이 브라우저에 자동 저장 중이에요';
  el.classList.toggle('bad', !ok);
  $('moreBtn').classList.toggle('warn', !ok || serverDown);
}
// 저장은 두 군데에 해요: 이 컴퓨터의 브라우저(localStorage) + 서버의 save.json.
// 서버가 꺼져 있어도 브라우저에는 계속 저장되고, 다음에 서버를 켜면 더 최근 것을 불러와서 이어서 해요.
function save(final) {
  if (!game) return;
  game.turtles.forEach(t => {
    const r = rt[t.id];
    // 여행지에 가 있는 동안은 섬에서 있던 자리를 저장해요
    const p = r && (r.islandPos || r.root.position);
    if (r) { t.px = +p.x.toFixed(3); t.pz = +p.z.toFixed(3); t.dir = +r.root.rotation.y.toFixed(3); }
  });
  game.lastSaved = Date.now();
  const json = JSON.stringify(game);
  let localOk = false;
  try { localStorage.setItem(KEY, json); localOk = true; } catch (e) {}
  if (!useServer) return setSaveState(localOk);
  // 창을 닫는 순간에는 sendBeacon이 더 확실하게 보내져요
  if (final && navigator.sendBeacon && navigator.sendBeacon('api/save', new Blob([json], { type: 'text/plain' }))) return;
  fetch('api/save', { method: 'POST', body: json, keepalive: json.length < 60000 })
    .then(r => setSaveState(r.ok || localOk, !r.ok))
    .catch(() => setSaveState(localOk, true));
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
    if (!old || old.dead) return null;
    const { poops, dead, lastSaved, ...t } = old;
    return { turtles: [{ ...t, id: 1 }], cur: 1, poops: poops || [], nextId: 2, lastSaved };
  } catch (e) { return null; }
}
async function load() {
  const local = loadLocal();
  let server = null;
  if (useServer) {
    try { const r = await fetch('api/save', { cache: 'no-store' }); if (r.ok) server = await r.json(); } catch (e) {}
  }
  if (server && local) return (server.lastSaved || 0) >= (local.lastSaved || 0) ? server : local;
  if (server || local) return server || local;
  // 아이패드에서 처음 열면, 컴퓨터에서 키우던 거북이들(start.json)로 시작해요
  if (!useServer) { try { const r = await fetch('start.json', { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {} }
  return null;
}

// 소리 (파일 없이 Web Audio로 만들어요)
// =====================================================================
const Sound = {
  ctx: null, music: null, sfx: null, nextTime: 0, step: 0, timer: null,
  init() {
    if (this.ctx) return this.ctx.state === 'suspended' && this.ctx.resume();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.music = this.ctx.createGain();
    this.music.gain.value = 0.35;
    this.music.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain();
    this.sfx.gain.value = 0.45;
    this.sfx.connect(this.ctx.destination);
    this.update();
  },
  // 게임 창을 보고 있지 않으면 음악을 살며시 줄이고, 돌아오면 다시 키워요
  audible: true,
  setAudible(on) {
    if (!this.ctx || on === this.audible) return;
    this.audible = on;
    this.music.gain.setTargetAtTime(on ? 0.35 : 0, this.ctx.currentTime, 0.6);
  },
  update() {
    if (!this.ctx || !game) return;
    if (game.settings.music && !this.timer) {
      this.nextTime = this.ctx.currentTime + 0.1;
      this.timer = setInterval(() => this.schedule(), 200);
    } else if (!game.settings.music && this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  },
  bell(freq, t, vol, out = this.music) {
    const c = this.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    g.connect(out);
    [[1, 1], [2, 0.25], [3, 0.08]].forEach(([m, v]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.frequency.value = freq * m;
      og.gain.value = v;
      o.connect(og).connect(g);
      o.start(t);
      o.stop(t + 1.9);
    });
  },
  pad(freq, t, dur) {
    const c = this.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    f.type = 'lowpass';
    f.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.035, t + 1.2);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.8);
    o.connect(f).connect(g).connect(this.music);
    o.start(t);
    o.stop(t + dur + 1);
  },
  // C - Am - F - G 를 천천히 반복하는 잔잔한 곡
  schedule() {
    const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
    const PENTA = [72, 74, 76, 79, 81];
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    const night = cur() && cur().asleep;
    const beat = night ? 0.62 : 0.48;
    while (this.nextTime < this.ctx.currentTime + 1.2) {
      const t = this.nextTime, pos = this.step % 8;
      const chord = CHORDS[Math.floor(this.step / 8) % 4];
      if (pos === 0) {
        chord.forEach(n => this.pad(hz(n - 12), t, beat * 8));
        this.bell(hz(chord[0] - 12), t, 0.06);
      }
      const chance = pos % 2 ? 0.15 : (night ? 0.35 : 0.6);
      if (Math.random() < chance) {
        const pool = pos % 4 === 0 ? chord.map(n => n + 12) : PENTA;
        this.bell(hz(pool[Math.floor(Math.random() * pool.length)]), t, 0.07);
      }
      this.nextTime += beat;
      this.step++;
    }
  },
  tones(list, vol = 0.25) {
    if (!this.ctx || !game || !game.settings.sfx) return;
    const now = this.ctx.currentTime;
    list.forEach(([freq, at, dur, type = 'sine', to]) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = now + at;
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.sfx);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
  },
  play(name) {
    const arp = (notes, gap, dur = 0.3, type) => notes.map((f, i) => [f, i * gap, dur, type]);
    const S = {
      click:  [[660, 0, 0.05, 'triangle']],
      select: [[700, 0, 0.08], [1050, 0.06, 0.1]],
      eat:    [[520, 0, 0.09, 'triangle', 360], [520, 0.16, 0.09, 'triangle', 360], [600, 0.32, 0.12, 'triangle', 420]],
      full:   [[330, 0, 0.15, 'triangle'], [262, 0.15, 0.2, 'triangle']],
      pop:    [[600, 0, 0.08, 'sine', 1300]],
      clean:  arp([1047, 1319, 1568, 2093], 0.07, 0.25),
      pet:    [[880, 0, 0.12], [1175, 0.08, 0.15]],
      hatch:  arp([523, 659, 784, 1047, 1319], 0.1, 0.4, 'triangle'),
      grow:   arp([523, 659, 784, 1047, 784, 1047], 0.09, 0.35, 'triangle'),
      sick:   [[440, 0, 0.25, 'triangle', 400], [370, 0.25, 0.4, 'triangle', 330]],
      heal:   arp([523, 659, 784, 1047], 0.08, 0.3),
      sleep:  arp([784, 659, 523], 0.22, 0.5),
      wake:   arp([523, 659, 784], 0.12, 0.3),
      poop:   [[220, 0, 0.18, 'sine', 90]],
      egg:    [[300, 0, 0.06, 'square', 250]],
      win:    arp([784, 988, 1175, 1568], 0.08, 0.3, 'triangle'),
      bye:    arp([659, 587, 523, 440, 392], 0.3, 0.7),
      lift:   [[500, 0, 0.15, 'sine', 900]],
      drop:   [[700, 0, 0.12, 'sine', 350]],
      // 여행지 체험 소리
      thump:   [[180, 0, 0.12, 'sine', 120], [240, 0.08, 0.1, 'triangle']],
      clink:   [[1800, 0, 0.08], [2400, 0.06, 0.12]],
      splash:  [[900, 0, 0.18, 'sawtooth', 200], [600, 0.05, 0.2, 'triangle', 150], [1200, 0.1, 0.1, 'sine', 400]],
      flutter: arp([1200, 1500, 1300, 1700], 0.05, 0.08),
      sizzle:  [[3000, 0, 0.3, 'sawtooth', 2500], [500, 0.05, 0.25, 'triangle', 650]],
      twinkle: arp([1568, 2093, 2637], 0.07, 0.35),
      whoosh:  [[300, 0, 0.3, 'sawtooth', 1200]],
      poof:    [[400, 0, 0.12, 'square', 120]],
      plop:    arp([800, 650, 520], 0.18, 0.1),
      shutter: [[2500, 0, 0.03, 'square'], [1800, 0.06, 0.04, 'square']],
    };
    if (S[name]) this.tones(S[name], name === 'click' ? 0.12 : 0.22);
  },
  // 노래 한 줄 부르기: [음, 박자] 목록. 노래하는 동안 배경음악은 살짝 작아져요.
  sing(notes, beat = 0.32) {
    if (!this.ctx || !game || !game.settings.sfx) return;
    let t = this.ctx.currentTime + 0.05;
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    notes.forEach(([n, b]) => { this.bell(hz(n), t, 0.22, this.sfx); this.bell(hz(n - 12), t, 0.08, this.sfx); t += beat * b; });
    const dur = notes.reduce((s, [, b]) => s + b, 0) * beat;
    this.music.gain.setTargetAtTime(0.08, this.ctx.currentTime, 0.1);
    clearTimeout(this.duckTimer);
    this.duckTimer = setTimeout(() => this.music.gain.setTargetAtTime(this.audible ? 0.35 : 0, this.ctx.currentTime, 0.4), dur * 1000 + 300);
  },
};
// '작은 별' 노래를 6줄로 나눠요 (캠프파이어 노래 체험에서 한 줄씩)
const C4 = 60, D4 = 62, E4 = 64, F4 = 65, G4 = 67, A4 = 69;
const TWINKLE = [

// 체험마다 어울리는 소리
const ACT_SOUNDS = {

// =====================================================================
// 시뮬레이션 (1초마다)
// =====================================================================
// 돌봐 줄 사람이 없을 때 보호해요.
// 화면을 안 보고 있거나 3분 넘게 아무것도 안 누르면 '자리 비움'이라 시간이 천천히 가고,
// 다시 돌아와도 1분 30초 동안은 건강이 5 밑으로 안 떨어져요. (돌봐 줄 시간을 줘요)
const IDLE_MS = 3 * 60 * 1000, GRACE_MS = 90 * 1000;
let lastActive = Date.now(), watchStart = Date.now();
['pointerdown', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, () => lastActive = Date.now(), true));
const watching = () => !document.hidden && Date.now() - lastActive < IDLE_MS;

function tick(t, dt, offline = false, guard = false) {
  // 여행 중에는 나이만 먹고 다른 상태는 그대로예요
  if (t.trip) {
    t.age += dt;
    // 여행은 시간 제한이 없어요. 내가 '섬으로'를 누르면 다 같이 돌아와요.
    return;
  }
  if (!t.hatched) {
    t.eggTime += dt;
    if (t.eggTime >= EGG_TIME) hatch(t, offline);
    return;
  }
  const before = stageOf(t).id;
  t.age += dt;
  const k = offline ? 0.25 : 1;   // 자리를 비운 동안은 천천히
  const sl = t.asleep;
  const poops = game.poops.length;

  t.hunger -= 0.12 * dt * k * (sl ? .5 : 1);
  t.happy  -= 0.07 * dt * k * (sl ? .3 : 1) * (1 - toyBonus());   // 장난감이 있으면 덜 떨어져요
  t.clean  -= (0.04 + 0.03 * poops) * dt * k;

  if (sl) {
    t.energy += 0.6 * dt;
    // 한번 자면 최소 2분은 푹 자요. 체력이 가득 차도 바로 안 일어나요.
    t.sleepFor = (t.sleepFor || 0) + dt;
    if (t.energy >= 100 && t.sleepFor >= 120) wake(t, true, offline);
  } else {
    t.energy -= 0.06 * dt * k;
    if (t.energy <= 3) sleep(t, true, offline);
  }

  if (t.nextPoop != null) {
    t.nextPoop -= dt;
    if (t.nextPoop <= 0) { t.nextPoop = null; addPoop(t, offline); }
  }

  if (!t.sick) {
    // 잘 돌봐 줘도 가끔은 아파요 (평균 10분에 한 번쯤). 지저분하거나 배고프면 더 잘 아파요.
    let p = 1 / 600;
    if (t.clean < 30) p += .004;
    if (poops >= 3) p += .004;
    if (t.hunger < 10) p += .003;
    if (t.energy < 15) p += .002;
    if (Math.random() < p * dt * k) {
      const keys = Object.keys(ILLS);
      t.sick = keys[Math.floor(Math.random() * keys.length)];
      t.health = clamp(t.health - 25);   // 아프면 건강이 바로 떨어져요
      if (!offline) {
        say(t, ILLS[t.sick].say, 3);
        Sound.play('sick');
        log(`${josa(t.name, '이', '가')} ${ILLS[t.sick].name}에 걸렸어요! 약을 주세요.`);
      }
    }
  }

  let dmg = 0;
  if (t.hunger <= 10) dmg += .15;
  if (t.clean <= 10) dmg += .1;
  if (t.happy <= 5) dmg += .05;
  if (t.sick) dmg += .12;
  if (t.health < 20) dmg *= .25;   // 위험할 땐 아주 천천히 줄어서, 떠나기 전에 몇 분은 돌봐 줄 시간이 있어요
  if (dmg > 0) t.health -= dmg * dt * k;
  else if (t.hunger > 50 && t.clean > 50) t.health += .05 * dt;

  for (const st of STATS) t[st.key] = clamp(t[st.key]);
  if (t.sick) t.health = Math.min(t.health, 70);   // 아픈 동안엔 건강이 70을 넘지 못해요
  if (offline || guard) t.health = Math.max(t.health, 5);
  // 거북이는 절대 떠나지 않아요. 건강이 아무리 낮아도 1은 남아요.
  if (t.health < 1) t.health = 1;

  const after = stageOf(t);
  if (!offline && before !== after.id) {
    say(t, `쑥쑥! ${josa(after.name, '으로', '로')} 자랐어요! ✨`);
    log(`${josa(t.name, '이', '가')} ${josa(after.name, '으로', '로')} 자랐어요.`);
    float(t, '✨', 3);
    Sound.play('grow');
  }

  // 여자 어른 거북이는 건강하고 행복하면 가끔 알을 낳아요 (평균 5분에 한 번, 낳은 뒤 15분은 쉬어요)
  if (t.gender === 'female' && (after.id === 'adult' || after.id === 'elder') && !offline) {
    t.layCooldown = Math.max(0, t.layCooldown - dt);
    const ready = eggReason(t) === 'ready' && !t.asleep;
    if (ready && Math.random() < dt / 180) layEgg(t);   // 평균 3분에 한 번
  }
}

const tripMates = t => game.turtles.filter(x => x.trip && x.trip.group === t.trip.group);
const nameList = list => list.map(x => x.name).join(', ');
function travelOk(t) {
  if (!t.hatched || t.trip) return '';
  if (t.asleep) return '자고 있어요';
  if (t.sick) return '아파요';
  if (t.health < 50) return '기운이 없어요';
  if (t.energy < 30) return '피곤해요';
  return 'ok';
}
function startTrip(list, key, join = false) {
  const p = TRIPS[key];
  const now = Date.now();
  // 나도 같이 가면, 인사가 끝난 뒤 여행지로 같이 가요
  if (join) setTimeout(() => { if (list[0].trip && list[0].trip.group === now) enterTrip(now); }, 1900);
  list.forEach((t, i) => {
    t.trip = { place: key, group: now, leave: now + 1800 };
    const r = rt[t.id];
    if (r) { r.target = null; r.hop = 2; }

  tabsSig = '';

function sendPostcard(t, silent) {
  const mates = tripMates(t);
  mates.forEach(x => x.trip.postcard = true);

  const p = TRIPS[t.trip.place];
  log(`📮 ${nameList(mates)}에게서 엽서가 왔어요: "${p.card}"`);

function comeHome(t, offline) {
  const p = TRIPS[t.trip.place];
  const mates = tripMates(t);
  if (viewTrip && viewTrip === t.trip.group) exitTrip();   // 나도 같이 섬으로 돌아와요
  mates.forEach(x => {
    x.trip = null;
    // 신나게 놀다 와서 기분은 좋지만 조금 배고프고 지저분해요 (친구랑 가면 더 신나요)
    x.happy = clamp(x.happy + 25 + (mates.length > 1 ? 10 : 0));
    x.hunger = clamp(x.hunger - 15);
    x.clean = clamp(x.clean - 20);
    x.energy = clamp(x.energy - 15);
    const r = rt[x.id];
    if (r) { r.hop = 2; r.wait = 3; }
    say(x, '다녀왔어요! 보고 싶었어요 💕', 3);
    float(x, '🎁', 1);
  });
  game.souvenirs.push({ type: p.gift, from: nameList(mates), place: p.name, at: Date.now() });
  renderSouvenirs();
  Sound.play('grow');
  const who = mates.length > 1 ? `${josa(nameList(mates), '이', '가')} 같이` : josa(t.name, '이', '가');
  log(`${who} ${p.name}에서 돌아왔어요! ${josa(p.giftName, '을', '를')} 선물로 가져왔어요.`);
  ask({ title: `${p.emoji} 여행에서 돌아왔어요!`, text: `${who} ${p.name}에서 돌아왔어요.\n선물로 ${josa(p.giftName, '을', '를')} 가져왔어요.\n섬에 놓아 둘게요! 🎁`, ok: '좋아요', cancel: false }, () => {});
  tabsSig = '';
  save();
}

    { id: 'snowman', kind: 'snowman', name: '눈사람 만들기', emoji: '⛄', verb: '눈 굴리기!', steps: 4, spot: [-1.2, .9], done: '귀여운 눈사람이 완성됐어요! ⛄' },
    { id: 'fight',   kind: 'snowball', name: '눈싸움',       emoji: '❄️', verb: '던지기!',    steps: 6, spot: [0, 1.2],   done: '눈싸움 정말 재밌었어요! ❄️' },
    { id: 'sled',    kind: 'sled',    name: '썰매 타기',     emoji: '🛷', verb: '쌩~!',       steps: 4, spot: [-2, -1],   done: '썰매 타고 쌩쌩 달렸어요! 🛷' },
  ],
  rainbow: [
    { id: 'wish',    kind: 'wish',    name: '소원 빌기',   emoji: '🌠', verb: '소원 빌기!', steps: 5, spot: [0, -.6],   done: '소원이 무지개에 닿았어요! 🌈' },
    { id: 'skip',    kind: 'skip',    name: '물수제비',    emoji: '🪨', verb: '퐁퐁!',      steps: 5, spot: [0, -1.2],  done: '물수제비가 퐁퐁퐁 튀었어요! 🪨' },
    { id: 'photo',   kind: 'photo',   name: '무지개 사진', emoji: '📸', verb: '찰칵!',      steps: 3, spot: [0, .8],    done: '무지개 앞에서 멋진 사진을 찍었어요! 📸' },
  ],
};
let actCur = null;   // 지금 하고 있는 체험
const TREASURE_N = 5;
const TREASURE_COL = { beach: '#ff7fae', flower: '#ffc21f', forest: '#8dff6a', snow: '#4fc3ff', rainbow: '#c77dff' };
const treasures = [];
let actGroup = null, actStep = 0, actOn = false;
const viewMates = () => viewTrip ? game.turtles.filter(t => t.trip && t.trip.group === viewTrip) : [];
// 지금 화면에 보이는 거북이: 여행지 / 침실(자는 거북이) / 섬(깨어 있는 거북이)
const shownNow = t => viewTrip ? !!(t.trip && t.trip.group === viewTrip && awayNow(t))
  : viewRoom ? !!(t.asleep && t.hatched && !t.trip && bedSpot(t))
  : !awayNow(t) && !(t.asleep && t.hatched && bedSpot(t));

function enterTrip(group) {
  if (viewTrip) exitTrip();
  if (viewRoom) exitRoom();
  const mates = game.turtles.filter(t => t.trip && t.trip.group === group);
  if (!mates.length) return;
  const key = mates[0].trip.place;
  viewTrip = group;
  viewDest = buildDest(key);
  setIsland(false);
  viewDest.g.visible = true;
  mates.forEach(t => {
    const r = rt[t.id];
    if (!r) return;
    r.islandPos = r.root.position.clone();   // 섬 자리는 기억해 둬요
    const [x, z] = areaRandom(r.size);
    r.root.position.set(x, 0, z);
    r.target = null;
    r.wait = rand(.5, 2);
  });
  actGroup = new THREE.Group();
  viewDest.g.add(actGroup);
  actStep = 0;
  actOn = false;
  actCur = null;
  viewDest.g.children.forEach(o => { if (o.children.some(c => c.isPointLight)) o.scale.setScalar(1); });   // 노래로 커진 모닥불 원래대로
  spawnTreasures(mates[0]);
  controls.target.set(0, 0, .4);
  lastCamTouch = 0;
  if (!mates.some(t => t.id === game.cur)) game.cur = mates[0].id;
  $('foodMenu').classList.remove('open');
  tabsSig = '';
  render();
  Sound.play('win');
  const p = TRIPS[key];
  log(`${p.emoji} ${p.name}에 도착했어요! 숨은 보물 ✨을 찾고, 🎨 체험도 골라서 해 봐요.`);
}
function exitTrip() {
  if (!viewTrip) return;
  game.turtles.forEach(t => {
    const r = rt[t.id];
    if (r && r.islandPos) { r.root.position.copy(r.islandPos); r.islandPos = null; r.target = null; }
  });
  treasures.forEach(m => viewDest.g.remove(m));
  treasures.length = 0;
  if (actGroup) { viewDest.g.remove(actGroup); actGroup = null; }
  actOn = false;
  actCur = null;
  $('actMenu').hidden = true;
  viewDest.g.visible = false;
  setIsland(true);
  viewTrip = null;
  viewDest = null;
  controls.target.set(0, 0, .4);
  lastCamTouch = 0;
  tabsSig = '';
  render();
}

function spawnTreasures(t) {
  const col = TREASURE_COL[t.trip.place];
  for (let i = t.trip.found || 0; i < TREASURE_N; i++) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(.24), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .9, roughness: .2 }));
    // 반짝이는 빛무리
    const halo = new THREE.Mesh(new THREE.SphereGeometry(.42, 16, 12), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .25, depthWrite: false }));
    m.add(halo);
    m.userData.halo = halo;
    const [x, z] = areaRandom(.3);
    m.position.set(x, .45, z);
    m.userData.phase = Math.random() * 6;
    m.castShadow = true;
    viewDest.g.add(m);
    treasures.push(m);
  }
}
decor.push(t => treasures.forEach(m => {
  m.rotation.y = t * 1.5 + m.userData.phase;
  m.position.y = .45 + Math.sin(t * 2 + m.userData.phase) * .08;
  const k = .5 + .5 * Math.sin(t * 4 + m.userData.phase);
  m.userData.halo.scale.setScalar(.85 + k * .35);
  m.userData.halo.material.opacity = .12 + k * .25;
}));
function collectTreasure(m) {
  viewDest.g.remove(m);
  treasures.splice(treasures.indexOf(m), 1);
  const mates = viewMates();
  mates.forEach(t => { t.trip.found = (t.trip.found || 0) + 1; t.happy = clamp(t.happy + 4); });
  award(3);
  const p = toScreen(m.position);
  floatAt('✨', p.x, p.y);
  const n = mates[0].trip.found;
  if (n >= TREASURE_N) {
    mates.forEach(t => t.happy = clamp(t.happy + 10));
    float(mates[0], '🎉', 3);
    Sound.play('win');
    log(`보물 ${TREASURE_N}개를 다 찾았어요! 🎉 모두 기분이 아주 좋아졌어요.`);
  } else {
    Sound.play('pop');
    log(`✨ 보물을 찾았어요! (${n}/${TREASURE_N})`);
  }
  render();
  save();
}

// 체험 고르기 메뉴
function openActMenu() {
  const mates = viewMates();
  if (!mates.length || actOn) return;
  const tr = mates[0].trip, done = tr.done || [];
  $('actMenu').innerHTML = ACTIVITIES[tr.place].map(a =>
    `<button data-act="${a.id}" ${done.includes(a.id) ? 'disabled' : ''}>${done.includes(a.id) ? '✅' : a.emoji} ${a.name}</button>`).join('');
  $('actMenu').hidden = !$('actMenu').hidden;
}
function startActivity(id) {
  const mates = viewMates();
  if (!mates.length || actOn) return;
  const tr = mates[0].trip;
  const a = ACTIVITIES[tr.place].find(x => x.id === id);
  if (!a || (tr.done || []).includes(id)) return;
  $('actMenu').hidden = true;
  actCur = a;
  actOn = true;
  actStep = 0;
  actGroup.userData = {};
  // 거북이들이 체험 자리로 모여요
  mates.forEach((t, i) => {
    const r = rt[t.id];
    const ang = i / mates.length * Math.PI * 2 + .5;
    const [x, z] = areaNearest(a.spot[0] + Math.cos(ang) * 1.2, a.spot[1] + Math.sin(ang) * 1.2, r.size);
    r.target = new THREE.Vector3(x, 0, z);
    r.wait = 8;
  });
  say(mates[0], `${a.emoji} ${a.name} 하자!`, 2);
  render();
}
function actTap() {
  if (!actOn || !actCur) return;
  const mates = viewMates();
  const a = actCur;
  actStep++;
  buildActivityStep(a, actStep, mates);
  mates.forEach(t => rt[t.id].hop = .6);
  if (actStep >= a.steps) {
    actOn = false;
    actCur = null;
    mates.forEach(t => { t.trip.done = [...(t.trip.done || []), a.id]; t.happy = clamp(t.happy + 15); });
    award(8);
    say(mates[0], a.done, 3.5);
    float(mates[0], '🎉', 3);
    if (a.kind !== 'song') Sound.play('win');   // 노래는 마지막 줄로 끝나요
    const left = ACTIVITIES[mates[0].trip.place].length - mates[0].trip.done.length;
    log(`${a.emoji} ${a.name} 체험 완료! ${a.done}` + (left ? ` 다른 체험도 ${left}개 더 있어요.` : ' 이곳 체험을 모두 해 봤어요! 🎉'));
    save();
  }
  // 노래 체험이면 노래 한 줄, 아니면 체험에 어울리는 소리
  if (a.kind === 'song') Sound.sing(TWINKLE[(actStep - 1) % TWINKLE.length]);
  else Sound.play(ACT_SOUNDS[a.kind] || 'pop');
  render();
}

// 탭할 때마다 생기는 모습들
function buildActivityStep(a, step, mates) {
  const [sx, sz] = a.spot;
  const ud = actGroup.userData;
  const add = (mesh, x, y, z) => { mesh.position.set(sx + x, y, sz + z); actGroup.add(shadows(mesh)); return mesh; };
  const glow = (color, r) => new THREE.Mesh(new THREE.OctahedronGeometry(r), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1 }));
  const anyMate = () => rt[mates[Math.floor(Math.random() * mates.length)].id].root.position;
  // anim(o, dt) 가 false를 돌려주면 사라져요
  const animate = (o, fn) => { o.userData.anim = fn; o.userData.age = 0; return o; };
  const atScreen = (emoji, v) => { const p = toScreen(v); floatAt(emoji, p.x, p.y); };

  switch (a.kind) {
    case 'castle':
      if (step <= 4) add(new THREE.Mesh(new THREE.CylinderGeometry(.5 - step * .08, .56 - step * .08, .22, 24), clay('#ecd29b')), 0, .11 + (step - 1) * .22, 0);
      if (step === 3) [-1, 1].forEach(s => add(new THREE.Mesh(new THREE.CylinderGeometry(.1, .13, .55, 12), clay('#e6c98e')), s * .62, .27, .15));
      if (step === 5) {
        add(new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .45, 6), clay('#ffffff')), 0, 1.1, 0);
        add(new THREE.Mesh(new THREE.ConeGeometry(.1, .22, 3), clay('#f39aa8')), .1, 1.25, 0).rotation.z = -Math.PI / 2;
      }
      break;
    case 'shells': {
      if (step === 1) add(new THREE.Mesh(new THREE.CylinderGeometry(.25, .2, .3, 20, 1, true), new THREE.MeshStandardMaterial({ color: '#9fd8f2', side: THREE.DoubleSide, roughness: .8 })), 0, .15, 0);
      const s = makeSouvenir(step % 2 ? 'shell' : 'shell');
      s.scale.setScalar(.6);
      const from = anyMate();
      s.position.set(from.x, .6, from.z);
      actGroup.add(s);
      const to = new THREE.Vector3(sx + (Math.random() - .5) * .2, .2 + step * .02, sz + (Math.random() - .5) * .2);
      animate(s, (o, dt) => { o.position.lerp(to, Math.min(1, dt * 6)); o.rotation.y += dt * 5; return true; });
      break;
    }
    case 'splash':
      for (let k = 0; k < 2; k++) {
        const ring = new THREE.Mesh(new THREE.RingGeometry(.15, .22, 32), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .9, side: THREE.DoubleSide }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(sx + (Math.random() - .5) * 2.5, .07, sz - .6 - Math.random() * .8);
        actGroup.add(ring);
        animate(ring, (o, dt) => { o.userData.age += dt; o.scale.setScalar(1 + o.userData.age * 4); o.material.opacity = .9 - o.userData.age; return o.userData.age < .9; });
      }
      for (let k = 0; k < 6; k++) {
        const drop = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), new THREE.MeshStandardMaterial({ color: '#bfe8ff', transparent: true, opacity: .9 }));
        const from = anyMate();
        drop.position.set(from.x, .3, from.z);
        const v = new THREE.Vector3((Math.random() - .5) * 2, 2 + Math.random(), (Math.random() - .5) * 2);
        actGroup.add(drop);
        animate(drop, (o, dt) => { v.y -= dt * 7; o.position.addScaledVector(v, dt); return o.position.y > 0; });
      }
      break;
    case 'bouquet': {
      if (step === 1) add(new THREE.Mesh(new THREE.CylinderGeometry(.18, .13, .4, 20), clay('#bfe6f7')), 0, .2, 0);
      const fl = flower(0, 0, flowerColors[step % flowerColors.length]);
      fl.scale.setScalar(2.2);
      add(fl, Math.cos(step * 1.3) * .1, .25, Math.sin(step * 1.3) * .1);
      if (step === 5) add(new THREE.Mesh(new THREE.TorusGeometry(.17, .03, 8, 20), clay('#e889a8')), 0, .36, 0).rotation.x = Math.PI / 2;
      break;
    }
    case 'bfly': {
      const g = new THREE.Group();
      const wm = new THREE.MeshStandardMaterial({ color: flowerColors[step % flowerColors.length], side: THREE.DoubleSide });
      const wings = [-1, 1].map(s => {
        const w = new THREE.Mesh(new THREE.CircleGeometry(.14, 16), wm);
        w.geometry.translate(.12, 0, 0);
        const p = new THREE.Group();
        p.add(w);
        p.scale.x = s;
        g.add(p);
        return p;
      });
      const from = anyMate();
      g.position.set(from.x, .5, from.z);
      const dir = new THREE.Vector3((Math.random() - .5), 1, (Math.random() - .5)).normalize();
      actGroup.add(g);
      animate(g, (o, dt) => {
        o.userData.age += dt;
        const f = Math.sin(o.userData.age * 18) * .9;
        wings[0].rotation.y = f; wings[1].rotation.y = -f;
        o.position.addScaledVector(dir, dt * 1.2);
        o.position.x += Math.sin(o.userData.age * 3) * dt;
        return o.position.y < 6;
      });
      break;
    }
    case 'crown': {
      const ang = (step - 1) / a.steps * Math.PI * 2;
      const fl = flower(0, 0, flowerColors[step % flowerColors.length]);
      fl.scale.setScalar(1.8);
      add(fl, Math.cos(ang) * .55, 0, Math.sin(ang) * .55);
      if (step === 1) add(new THREE.Mesh(new THREE.TorusGeometry(.55, .03, 8, 48), clay('#7fb46a')), 0, .05, 0).rotation.x = Math.PI / 2;
      break;
    }
    case 'mallow':
      if (step === 1) {
        add(new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, 1.3, 6), clay('#b8875f')), 0, .45, -.4).rotation.x = Math.PI / 2 - .35;
        ud.mallow = add(new THREE.Mesh(new THREE.CapsuleGeometry(.08, .1, 4, 10), clay('#ffffff')), 0, .66, -1.0);
      }
      ud.mallow.material.color.set('#ffffff').lerp(new THREE.Color('#d39a52'), step / a.steps);
      atScreen('🔥', new THREE.Vector3(sx, .9, sz - 1));
      break;
    case 'stars': {
      const st = glow('#fff3a0', .09 + Math.random() * .06);
      st.position.set((Math.random() - .5) * 7, 3 + Math.random() * 1.5, -2 - Math.random() * 2);
      actGroup.add(st);
      const ph = Math.random() * 6;
      animate(st, (o, dt) => { o.userData.age += dt; o.rotation.y += dt * 2; o.scale.setScalar(.8 + .3 * Math.sin(o.userData.age * 4 + ph)); return true; });
      if (step === a.steps) {
        const shoot = glow('#ffffff', .12);
        shoot.position.set(-4, 4.5, -3);
        actGroup.add(shoot);
        animate(shoot, (o, dt) => { o.position.x += dt * 6; o.position.y -= dt * 1.5; return o.position.x < 5; });
      }
      break;
    }
    case 'song':
      mates.forEach(t => atScreen(['🎵', '🎶', '♪'][step % 3], new THREE.Vector3().copy(rt[t.id].root.position).setY(.9)));
      if (!ud.flame) ud.flame = buildDest('forest').g.children.find(o => o.children && o.children.some(c => c.isPointLight));
      if (ud.flame) ud.flame.scale.setScalar(1 + step * .08);
      break;
    case 'snowman': {
      const balls = [[.38, .38], [.28, .95], [.2, 1.38]];
      if (step <= 3) add(new THREE.Mesh(new THREE.SphereGeometry(balls[step - 1][0], 24, 18), clay('#ffffff')), 0, balls[step - 1][1], 0);
      if (step === 4) {
        add(new THREE.Mesh(new THREE.ConeGeometry(.04, .2, 10), clay('#f59a4f')), 0, 1.38, .26).rotation.x = Math.PI / 2;
        add(new THREE.Mesh(new THREE.CylinderGeometry(.14, .16, .22, 16), clay('#9fd8f2')), 0, 1.65, 0);
        [-1, 1].forEach(s => add(new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), clay('#333333')), s * .07, 1.45, .18));
      }
      break;
    }
    case 'snowball': {
      const ball = new THREE.Mesh(new THREE.SphereGeometry(.09, 12, 10), clay('#ffffff'));
      const from = anyMate().clone().setY(.4);
      const to = new THREE.Vector3(sx + (Math.random() - .5) * 3, 0, sz + (Math.random() - .5) * 2);
      ball.position.copy(from);
      actGroup.add(ball);
      animate(ball, (o, dt) => {
        o.userData.age += dt * 1.4;
        const k = Math.min(1, o.userData.age);
        o.position.lerpVectors(from, to, k);
        o.position.y = .4 + Math.sin(k * Math.PI) * 1.2;
        if (k >= 1) { const p = toScreen(o.position); floatAt('💥', p.x, p.y); return false; }
        return true;
      });
      break;
    }
    case 'sled': {
      // 썰매를 타고 언덕 아래로 쌩~
      if (step === 1) mates.forEach(t => {
        const sled = new THREE.Mesh(new THREE.BoxGeometry(.5, .06, .3), clay('#e889a8'));
        sled.userData.mate = t.id;
        actGroup.add(sled);
        animate(sled, o => { const r = rt[o.userData.mate]; if (!r) return false; o.position.copy(r.root.position).setY(.04); o.rotation.y = r.root.rotation.y; return true; });
      });
      mates.forEach((t, i) => {
        const r = rt[t.id];
        const [x, z] = areaNearest(sx + step * 1.1 - 1, sz + 1 + i * .7 + (step % 2) * .5, r.size);
        r.target = new THREE.Vector3(x, 0, z);
        r.wait = 6;
      });
      atScreen('💨', anyMate().clone().setY(.5));
      break;
    }
    case 'wish': {
      const star = add(glow('#fff3a0', step === a.steps ? .3 : .16), 0, .4, 0);
      animate(star, (o, dt) => { o.position.y += dt * 1.6; o.rotation.y += dt * 4; return o.position.y < 5; });
      break;
    }
    case 'skip': {
      // 돌이 퐁퐁퐁 세 번 튀어요
      for (let k = 0; k < 3; k++) {
        const ring = new THREE.Mesh(new THREE.RingGeometry(.1, .15, 28), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, side: THREE.DoubleSide }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(sx - .8 + k * .7, .07, sz - 1.4 - k * .3);
        actGroup.add(ring);
        const delay = k * .25;
        animate(ring, (o, dt) => {
          o.userData.age += dt;
          const t2 = o.userData.age - delay;
          if (t2 < 0) return true;
          o.material.opacity = Math.max(0, .9 - t2);
          o.scale.setScalar(1 + t2 * 3);
          return t2 < .9;
        });
      }
      break;
    }
    case 'photo': {
      // 찰칵! 화면이 번쩍
      const fl = document.createElement('div');
      fl.style.cssText = 'position:absolute;inset:0;background:#fff;pointer-events:none;';
      sceneEl.appendChild(fl);
      fl.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 500 }).onfinish = () => fl.remove();
      mates.forEach(t => say(t, ['브이~ ✌️', '김치~ 😁', '하트! 💕'][step - 1], 1.6));
      break;
    }
  }
}
// 체험 효과 움직이기
decor.push((t, dt) => {
  if (!actGroup) return;
  actGroup.children.slice().forEach(o => {
    if (o.userData.anim && o.userData.anim(o, dt) === false) actGroup.remove(o);
  });
});

// 기념품: 집 근처에 하나씩 놓여요
const souvenirMeshes = [];
const SOUVENIR_SPOTS = [[2.5, -3.6], [3.0, -3.0], [2.2, -2.9], [-0.1, -3.7], [0.4, -3.1], [-.5, -3.2], [3.4, -2.4], [2.7, -2.3], [-1.0, -3.7], [1.6, -2.8]];
function makeSouvenir(type) {
  const g = new THREE.Group();
  if (type === 'shell') {
    const s = new THREE.Mesh(new THREE.SphereGeometry(.18, 24, 12, 0, Math.PI), clay('#fbe0d6'));
    s.rotation.x = -Math.PI / 2;
    s.scale.set(1, 1, .45);
    s.position.y = .02;
    g.add(s);
    for (let k = -2; k <= 2; k++) {
      const rib = new THREE.Mesh(new THREE.BoxGeometry(.012, .07, .16), clay('#f2bfae'));
      rib.position.set(k * .06, .05, -.02);
      rib.rotation.y = k * .25;
      g.add(rib);
    }
  } else if (type === 'pinecone') {
    for (let k = 0; k < 4; k++) {
      const c = new THREE.Mesh(new THREE.ConeGeometry(.13 - k * .025, .1, 10), clay(k % 2 ? '#b07b50' : '#9c6a42'));
      c.position.y = .26 - k * .06;
      c.rotation.x = Math.PI;
      g.add(c);
    }
  } else if (type === 'crystal') {

  } else if (id === 'sunglass') {

function eggReason(t) {
  const st = stageOf(t).id;
  if (t.gender !== 'female' || (st !== 'adult' && st !== 'elder') || t.trip) return '';
  if (game.turtles.length >= MAX_TURTLES) return `🥚 섬이 꽉 찼어요 (최대 ${MAX_TURTLES}마리)`;
  if (t.sick) return '🥚 아파서 알을 못 낳아요. 💊 약을 주세요';
  if (t.health < 40) return `🥚 건강이 40이 되면 알을 낳아요 (지금 ${Math.round(t.health)})`;
  if (t.hunger < 30) return '🥚 배가 불러야 알을 낳아요. 🥬 밥을 주세요';
  if (t.happy < 40) return '🥚 기분이 좋아야 알을 낳아요. 🫧 놀아 주세요';
  if (t.layCooldown > 0) return `🥚 ${Math.ceil(t.layCooldown / 60)}분 쉬고 나면 알을 낳을 수 있어요`;

function layEgg(mom) {
