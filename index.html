  award(5);
  mom.happy = clamp(mom.happy + 10);
  say(mom, '알을 낳았어요! 🥚💕', 3);
  float(baby, '💕', 3);
  Sound.play('hatch');
  log(`${josa(mom.name, '이', '가')} 알을 낳았어요! 아기 이름은 ${josa(name, '이에요', '예요')}. 아기를 고르고 이름을 누르면 바꿀 수 있어요.`);
  tabsSig = '';
  save();
}

function hatch(t, silent) {
  t.hatched = true;
  if (rt[t.id]) buildModel(t);
  if (silent) return;
  say(t, '안녕! 반가워요! 💚');
  log(`${josa(t.name, '이', '가')} 태어났어요! 잘 돌봐 주세요.`);
  float(t, '🎉', 3);
  Sound.play('hatch');
  award(5);
}

function addPoop(t, silent) {
  if (game.poops.length >= 6) return;
  let x, z;
  const r = rt[t.id];
  if (r) {
    const back = new THREE.Vector3(-1, 0, 0).applyQuaternion(r.root.quaternion).multiplyScalar(r.size * 2);
    [x, z] = nearestFree(r.root.position.x + back.x, r.root.position.z + back.z, .2);
  } else [x, z] = randomFree(.3);
  game.poops.push({ x: +x.toFixed(2), z: +z.toFixed(2) });
  if (!silent) { log(`${josa(t.name, '이', '가')} 응가를 했어요. 치워 주세요!`); renderPoops(); Sound.play('poop'); }
}

function sleep(t, auto, silent) {
  t.asleep = true;
  t.sleepFor = 0;   // 잠든 시간 다시 세기
  if (rt[t.id]) rt[t.id].target = null;
  if (silent) return;
  say(t, '쿨쿨… 💤');
  Sound.play('sleep');
  log(auto ? `${josa(t.name, '이', '가')} 지쳐서 잠들었어요.` : `${josa(t.name, '을', '를')} 재웠어요. 잘 자~`);
}
function wake(t, auto, silent) {
  t.asleep = false;
  if (silent) return;
  if (!auto && t.energy < 40) { t.happy = clamp(t.happy - 10); say(t, '아직 졸린데… 😪'); }
  else say(t, '잘 잤다~ ☀️');
  Sound.play('wake');
  log(auto ? `${josa(t.name, '이', '가')} 푹 자고 일어났어요.` : `${josa(t.name, '을', '를')} 깨웠어요.`);
}

// =====================================================================
// 돌보기 (고른 거북이에게)
// =====================================================================
function canAct() {
  const t = cur();
  if (!t || busy) return null;
  if (!t.hatched) { log('아직 알이에요. 톡톡 두드려 보세요!'); return null; }
  return t;
}

function feed(type) {
  $('foodMenu').classList.remove('open');
  const t = canAct();
  if (!t) return;
  if (t.asleep) return say(t, '쿨쿨… 💤');
  // 기본 먹이 또는 가방에 있는 과일·간식
  const bagItem = !FOODS[type] && shopItem(type);
  if (bagItem && !(game.bag[type] > 0)) return;
  const f = FOODS[type] || { emoji: bagItem.emoji, name: bagItem.name, ...bagItem.eff };
  if (f.hunger && t.hunger >= 95) { t.happy = clamp(t.happy - 3); say(t, '배불러요~ 🙅'); Sound.play('full'); return render(); }
  Sound.play('eat');
  ['hunger', 'happy', 'clean', 'energy', 'health'].forEach(k => { if (f[k]) t[k] = clamp(t[k] + f[k]); });
  if (f.hunger && t.nextPoop == null) t.nextPoop = rand(40, 90);
  const r = rt[t.id];
  r.target = null;
  r.wait = 2.5;
  if (bagItem) {
    game.bag[type]--;
    if (game.bag[type] <= 0) delete game.bag[type];
    float(t, f.emoji, 2);
    renderFoodMenu();
  } else dropFood(t, type);
  if (t.hunger < 90 || bagItem) award(1);
  say(t, `냠냠 ${f.emoji} 맛있어요!`);
  log(`${t.name}에게 ${josa(f.name, '을', '를')} 줬어요.`);
  render();
  save();
}

function clean() {
  const t = canAct();
  if (!t) return;
  if (t.asleep) return say(t, '쿨쿨… 💤');
  const had = game.poops.length;
  game.poops = [];
  t.clean = 100;
  t.happy = clamp(t.happy + 3);
  renderPoops();
  soapBubbles(t);
  say(t, '뽀득뽀득 ✨');
  if (had) award(1);
  Sound.play('clean');
  log(had ? `섬의 응가를 치우고 ${josa(t.name, '을', '를')} 씻겼어요.` : `${josa(t.name, '을', '를')} 깨끗이 씻겼어요.`);
  render();
}

function toggleSleep() {
  const t = canAct();
  if (!t) return;
  if (t.asleep) wake(t, false); else sleep(t, false);
  render();
}

function medicine() {
  const t = canAct();
  if (!t) return;
  if (!t.sick) { t.happy = clamp(t.happy - 5); say(t, '안 아픈데요? 😖'); Sound.play('full'); return render(); }
  Sound.play('heal');
  const name = ill(t).name;
  t.sick = false;
  t.health = clamp(t.health + 20);
  t.happy = clamp(t.happy - 5);
  say(t, '으, 써요… 그래도 나았어요!');
  award(1);
  float(t, '✨', 2);
  log(`${josa(t.name, '이', '가')} 약을 먹고 ${josa(name, '이', '가')} 나았어요.`);
  render();
}

function play() {
  const t = canAct();
  if (!t) return;
  if (t.asleep) return say(t, '쿨쿨… 💤');
  if (t.energy < 15) return say(t, '너무 피곤해요… 😪');
  busy = true;
  render();
  const id = t.id;
  let popped = 0, left = 10;
  const hud = $('hud');
  hud.style.display = 'block';
  const updateHud = () => hud.textContent = `🫧 물방울을 터뜨려요! ${popped}개 · ${left}초`;
  updateHud();
  say(t, '물방울을 터뜨려 주세요!');
  const spawn = setInterval(() => {
    const b = document.createElement('div');
    b.className = 'game-bubble';
    b.style.left = rand(5, 88) + '%';
    b.style.animationDuration = rand(3, 4.5) + 's';
    b.addEventListener('pointerdown', e => {
      e.stopPropagation();
      popped++;
      updateHud();
      Sound.play('pop');
      const r = sceneEl.getBoundingClientRect(), br = b.getBoundingClientRect();
      floatAt('💥', br.left - r.left + br.width / 2, br.top - r.top + br.height / 2);
      b.remove();
    });
    b.addEventListener('animationend', () => b.remove());
    sceneEl.appendChild(b);
  }, 550);
  const timer = setInterval(() => {
    left--;
    updateHud();
    if (left > 0) return;
    clearInterval(timer); clearInterval(spawn);
    sceneEl.querySelectorAll('.game-bubble').forEach(b => b.remove());
    hud.style.display = 'none';
    busy = false;
    const p = game.turtles.find(x => x.id === id);
    if (!p) return render();
    Sound.play('win');
    p.happy = clamp(p.happy + 8 + popped * 3);
    award(popped);
    p.energy = clamp(p.energy - 10);
    p.hunger = clamp(p.hunger - 5);
    rt[id].hop = 3;
    say(p, popped >= 10 ? `${popped}개나! 최고예요! 🥳` : `${popped}개! 재밌었어요 😆`);
    float(p, '💖', Math.min(5, 1 + Math.floor(popped / 4)));
    log(`${josa(p.name, '이', '가')} 물방울 ${popped}개를 터뜨렸어요.`);
    render();
  }, 1000);
}

function select(id) {
  if (busy || !game.turtles.some(t => t.id === id)) return;
  if (game.cur !== id) Sound.play('select');
  game.cur = id;
  $('foodMenu').classList.remove('open');
  render();
  save();
}

// 고른 거북이를 한 번 더 누르면: 알은 톡톡, 거북이는 쓰다듬기
function tapPet(id) {
  const t = game.turtles.find(x => x.id === id);
  if (!t || busy) return;
  const r = rt[id];
  if (game.cur !== id) {
    select(id);
    if (t.hatched && !t.asleep) say(t, '나 불렀어요? 😊', 1.5);
    return;
  }
  if (!t.hatched) {
    t.eggTime += 3;
    r.hop = 1;
    Sound.play('egg');
    log(t.eggTime >= EGG_TIME - 6 ? '알에 금이 갔어요…!' : '톡톡! 알이 꿈틀거려요.');
    if (t.eggTime >= EGG_TIME) { hatch(t); render(); }
    return;
  }
  if (t.asleep) return say(t, '음냐… 💤');
  if (r.cool > 0) return;
  r.cool = 1;
  r.hop = 1;
  Sound.play('pet');
  t.happy = clamp(t.happy + 2);
  float(t, '💗', 1);
  render();
}

// =====================================================================
// 화면 그리기 (상태창, 탭, 거북이 모습)
// =====================================================================
function needText(t) {
  if (!t.hatched || t.trip) return '';
  if (t.health < 20) return '기운이 없어요… 도와주세요! 🆘';
  if (t.asleep) return '';
  if (t.sick) return ill(t).say;
  if (t.hunger < 25) return '배고파요! 🍽️';
  if (game.poops.length >= 2) return '치워 주세요~ 💩';
  if (t.clean < 30) return '씻고 싶어요 🛁';
  if (t.energy < 20) return '졸려요… 😪';
  if (t.happy < 30) return '심심해요! 🫧';
  return '';
}

let tabsSig = '';
function renderTabs() {
  const sig = game.turtles.map(t => [t.id, t.name, t.color, !!needText(t), !!t.trip].join(':')).join('|') + '#' + game.cur + busy;
  if (sig === tabsSig) return;
  tabsSig = sig;
  $('tabs').innerHTML = game.turtles.map(t =>
    `<button data-id="${t.id}" class="${t.id === game.cur ? 'on' : ''}">` +
    `<span class="dot" style="background:${PALETTES[t.color].shell}"></span>${t.name}` +
    (t.trip ? ' ' + TRIPS[t.trip.place].emoji : needText(t) ? '<span class="warn">!</span>' : '') + '</button>'
  ).join('') + (game.turtles.length < MAX_TURTLES ? '<button class="add" data-add="1">＋ 거북이 추가</button>' : '');
}

const SICK_SKIN = new THREE.Color('#c9c98f');
function updatePetLook(t) {
  const r = rt[t.id];
  if (!r) return;
  if (r.hatched !== t.hatched) buildModel(t);
  r.tag.textContent = t.name;
  r.tag.classList.toggle('on', t.id === game.cur);
  const m = r.model;
  if (m.egg) return;
  m.skinMats.forEach(mat => mat.color.copy(m.skinColor).lerp(SICK_SKIN, t.sick ? .65 : 0));
  m.glasses.visible = false;   // 안경 없이 귀여운 눈 그대로
  const mood = (t.hunger + t.happy + t.clean) / 3;
  m.mouth.rotation.z = mood > 30 ? Math.PI : 0;     // 웃음 / 시무룩
  m.mouth.scale.y = mood > 60 ? 1 : mood > 30 ? .25 : .8;
  m.mouth.position.y = mood > 30 ? 0 : -.1;
  if (r.say <= 0) {
    // 원하는 게 있으면 고른 거북이만 말풍선으로 알려 줘요 (다른 거북이는 탭에 ! 표시)
    const need = t.id === game.cur ? needText(t) : '';
    r.bubble.textContent = need;
    r.bubble.classList.toggle('show', !!need);
  }
}

function render() {
  if (!game) return;
  syncView();
  renderCoins();
  renderSeason();
  renderTabs();
  game.turtles.forEach(updatePetLook);
  $('memBtn').hidden = !game.memorial.length;
  const rel = cur();
  $('releaseBtn').hidden = !rel || !!rel.trip;
  if (rel) $('releaseBtn').textContent = `👋 ${josa(rel.name, '을', '를')} 바다로 보내 주기`;
  const t = cur();
  const n = game.turtles.length;
  $('subtitle').textContent = n > 1 ? `거북이 ${n}마리를 함께 키우고 있어요` : t ? `${josa(t.name, '을', '를')} 돌봐 주세요` : '작은 거북이를 돌봐 주세요';
  // 여행지 상단 바
  const vm = viewMates();
  $('tripBanner').hidden = !vm.length;
  $('actTap').hidden = !(vm.length && actOn);
  if (vm.length) {
    const tr = vm[0].trip, p = TRIPS[tr.place], acts = ACTIVITIES[tr.place], done = tr.done || [];
    const leftMin = Math.max(1, Math.ceil((tr.end - Date.now()) / 60000));
    $('tripInfo').textContent = `${p.emoji} ${p.name} · ✨ ${tr.found || 0}/${TREASURE_N}`;
    $('actBtn').textContent = actOn && actCur ? `${actCur.emoji} 체험 중…` : `🎨 체험 ${done.length}/${acts.length}`;
    $('actBtn').disabled = actOn;
    if (actCur) $('actTap').textContent = `${actCur.emoji} ${actCur.verb} (${actStep}/${actCur.steps})`;
  }
  ['quickFeedBtn', 'feedBtn', 'playBtn', 'cleanBtn', 'medBtn', 'tripBtn'].forEach(id => $(id).disabled = !t || !t.hatched || t.asleep || busy || onTrip(t));
  $('sleepBtn').disabled = !t || !t.hatched || busy || onTrip(t);
  $('sleepBtn').innerHTML = t && t.asleep ? '<span class="ic">☀️</span>깨우기' : '<span class="ic">🌙</span>재우기';
  if (!t) { $('petName').textContent = '-'; $('stageName').textContent = '-'; $('ageText').textContent = ''; $('stats').innerHTML = ''; $('eggHint').hidden = true; return; }
  const st = stageOf(t);
  $('petName').textContent = t.name;
  const egg = eggReason(t);
  $('eggHint').hidden = !egg;
  $('eggHint').textContent = egg === 'ready' ? '🥚 곧 알을 낳을 거예요! 💕' : egg;
  $('stageName').textContent = st.name
    + (t.trip ? ` · ${TRIPS[t.trip.place].emoji} ${TRIPS[t.trip.place].name} 여행 중` : '')
    + (t.mom && st.id !== 'adult' && st.id !== 'elder' ? ` · 엄마 ${t.mom}` : '')
    + (t.sick ? ` · ${ill(t).emoji} ${ill(t).name}` : '');
  $('ageText').textContent = t.hatched ? ageLabel(t) : `부화까지 ${Math.max(0, Math.ceil(EGG_TIME - t.eggTime))}초`;
  $('stats').innerHTML = STATS.map(x => {
    const v = Math.round(t[x.key]);
    // 아플 때는 건강 막대를 주황색 + 🤒 로 보여 줘요
    const sickHealth = x.key === 'health' && t.sick;
    const color = v < 25 ? '#e5554f' : sickHealth ? '#f2994a' : x.color;
    const label = sickHealth ? `${x.label} ${ill(t).emoji}` : x.label;
    return `<div class="stat"><div class="top"><span>${label}</span><span>${v}</span></div><div class="bar"><i style="width:${v}%;background:${color}"></i></div></div>`;
  }).join('');
}

function loop() {
  if (!game) return;
  const w = watching();
  if (!w) watchStart = null;
  else if (watchStart == null) watchStart = Date.now();
  const guard = !w || Date.now() - watchStart < GRACE_MS;
  // 다른 창을 보고 있거나(포커스 없음) 자리를 비우면 음악을 줄여요
  Sound.setAudible(w && document.hasFocus());
  // 아무도 안 보고 있으면(3분 넘게 그대로) 시간이 멈춰요 ⏸️
  if (w) for (const t of [...game.turtles]) tick(t, 1, false, guard);
  for (const t of game.turtles) { const r = rt[t.id]; if (r && r.cool > 0) r.cool--; }
  render();
}

// =====================================================================
// 누르기 / 끌어서 옮기기
// 거북이를 누르면 고르기, 누른 채로 끌면 들어서 옮기기, 빈 곳을 끌면 화면 돌리기
// =====================================================================
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let press = null;
function aim(e) {
  const r = canvas.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
}
function pick(e) {
  aim(e);
  const hits = ray.intersectObjects(pickables.filter(h => h.parent.visible), false);   // 여행 간 거북이는 못 눌러요
  return hits.length ? hits[0].object.userData.id : null;
}
// 캡처 단계에서 먼저 받아서, 거북이를 누른 경우엔 화면 돌리기를 막아요
sceneEl.addEventListener('pointerdown', e => {
  if (e.target !== canvas || !game) return;
  const id = pick(e);
  // 여행지 보물
  let treasure = null;
  if (id == null && treasures.length) {
    const th = ray.intersectObjects(treasures, false);
    if (th.length) treasure = th[0].object;
  }
  // 그네를 눌렀는지
  const sw = id == null && !viewTrip && !viewRoom && swingObj();
  const swing = !!(sw && ray.intersectObject(sw, true).length);
  press = { id, treasure, swing, x: e.clientX, y: e.clientY, dragging: false };
  if (id != null) {
    controls.enabled = false;
    canvas.setPointerCapture(e.pointerId);
  }
}, true);
canvas.addEventListener('pointermove', e => {
  if (press && press.id != null) {
    const t = game.turtles.find(x => x.id === press.id), r = rt[press.id];
    if (!t || !r) return;
    if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6 && !busy && !viewRoom) {
      press.dragging = true;
      if (r.riding) endRide(t, true);   // 그네에서 들어 올리면 내려요
      r.drag = true;
      r.target = null;
      if (game.cur !== t.id) select(t.id);
      say(t, !t.hatched ? '어디로 가요? 🥚' : t.asleep ? '음냐… 어디 가요? 💤' : '와~ 날아간다! 🙌', 30);
      Sound.play('lift');
      canvas.style.cursor = 'grabbing';
    }
    if (press.dragging) {
      aim(e);
      const pt = new THREE.Vector3();
      if (ray.ray.intersectPlane(groundPlane, pt)) {
        const d = Math.hypot(pt.x, pt.z), lim = areaR();
        if (d > lim) pt.multiplyScalar(lim / d);
        r.root.position.x = pt.x;
        r.root.position.z = pt.z;
      }
    }
    return;
  }
  const swHover = !!game && !viewTrip && !viewRoom && swingObj();
  canvas.classList.toggle('hover', !!game && (pick(e) != null || (treasures.length > 0 && ray.intersectObjects(treasures, false).length > 0)
    || !!(swHover && ray.intersectObject(swHover, true).length)));
});
function release(e) {
  if (!press) return;
  const { id, dragging, treasure, swing, x: px, y: py } = press;
  press = null;
  controls.enabled = true;
  canvas.style.cursor = '';
  const tapped = Math.hypot(e.clientX - px, e.clientY - py) < 8;
  if (id == null) {
    if (treasure && treasures.includes(treasure) && tapped) collectTreasure(treasure);
    // 그네를 톡 누르면 지금 고른 거북이가 타요
    if (swing && tapped) {
      const c = cur();
      if (c && !startRide(c)) say(c, c.asleep ? '쿨쿨… 💤' : '지금은 못 타요', 1.5);
    }
    return;
  }
  const t = game.turtles.find(x => x.id === id), r = rt[id];
  if (!t || !r) return;
  if (dragging) {
    r.drag = false;
    // 그네 위에 놓으면 그네를 타요
    if (nearSwing(r.root.position.x, r.root.position.z) && startRide(t)) { save(); return; }
    const [x, z] = areaNearest(r.root.position.x, r.root.position.z, r.size);
    r.root.position.x = x;
    r.root.position.z = z;
    r.wait = 2.5;
    r.hop = .5;
    Sound.play('drop');
    say(t, !t.hatched ? '여기 따뜻해요 🥚' : t.asleep ? '쿨쿨… 💤' : '여기 좋아요! 😊', 1.8);
    save();
    return;
  }
  tapPet(id);
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

// =====================================================================
// 매 프레임 (걷기, 애니메이션, 밤낮)
// =====================================================================
function resize() {
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(sceneEl);
resize();

const clock = new THREE.Clock();
const v = new THREE.Vector3();
let nightK = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  if (game) {
    game.turtles.forEach(t => {
      const r = rt[t.id];
      if (!r) return;
      const pos = r.root.position, m = r.model;
      // 여행 간 거북이는 섬에서 안 보이고, 나도 같이 가면 여행지에서 보여요
      const shown = shownNow(t);
      r.root.visible = shown;
      r.tag.style.display = shown ? '' : 'none';
      if (!shown) { r.bubble.classList.remove('show'); return; }
      // 자라면서 크기가 천천히 커져요
      r.size += (stageOf(t).size - r.size) * Math.min(1, dt * 2);
      r.root.scale.setScalar(r.size);
      // 바다로 보내 줄 때: 빙글빙글 돌면서 위로 올라가며 작아져요
      if (r.leaving) {
        r.leaveT = (r.leaveT || 0) + dt;
        pos.y = r.leaveT * .9;
        r.root.rotation.y += dt * 6;
        r.root.scale.setScalar(r.size * Math.max(.02, 1 - r.leaveT / 2.2));
        r.tag.style.display = 'none';
        const hp = headScreen(t);
        r.bubble.style.left = hp.x + 'px';
        r.bubble.style.top = hp.y + 'px';
        return;
      }
      if (m.egg) {
        m.g.rotation.z = Math.sin(time * 3 + r.phase) * .06 + (r.hop > 0 ? Math.sin(time * 30) * .15 : 0);
      } else {
        let moving = false;
        if (!t.asleep && !r.drag && !busy && !r.riding && (!t.trip || viewTrip)) {
          if (!r.target) {
            r.wait -= dt;
            if (r.wait <= 0) {
              const [x, z] = areaRandom(r.size);
              r.target = new THREE.Vector3(x, 0, z);
              r.wait = 2 + Math.random() * 4;
            }
          } else {
            const d = v.subVectors(r.target, pos);
            d.y = 0;
            const dist = d.length();
            if (dist < .1) r.target = null;
            else {
              const want = -Math.atan2(d.z, d.x);
              const diff = ((want - r.root.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
              r.root.rotation.y += diff * Math.min(1, dt * 4);
              if (Math.abs(diff) < .6) {
                d.normalize().multiplyScalar(Math.min(dist, (.55 + r.size * .4) * dt));
                const nx = pos.x + d.x, nz = pos.z + d.z;
                if (areaFree(nx, nz, r.size * .8)) { pos.x = nx; pos.z = nz; moving = true; }
                else r.target = null;
              }
            }
          }
        }
        // 거북이끼리 겹치지 않게 살짝 밀기
        if (!r.drag && !r.riding) game.turtles.forEach(q => {
          const o = rt[q.id];
          if (q === t || !o || !shownNow(q)) return;
          const dx = pos.x - o.root.position.x, dz = pos.z - o.root.position.z, dd = Math.hypot(dx, dz), min = (r.size + o.size) * 1.5;
          if (dd > 0 && dd < min) { pos.x += dx / dd * (min - dd) * .05; pos.z += dz / dd * (min - dd) * .05; }
        });
        m.legs.forEach((l, k) => l.position.y = r.drag ? m.legY - .06 + Math.sin(time * 18 + k * 1.7) * .1
          : m.legY + (moving ? Math.max(0, Math.sin(time * 10 + k * Math.PI / 2)) * .1 : 0));
        m.g.rotation.z = moving ? Math.sin(time * 10) * .03 : r.drag ? Math.sin(time * 4) * .12 : 0;
        const blink = t.asleep ? .1 : ((time + r.phase) % 4 < .12 ? .1 : 1);
        m.eyes.forEach(e => e.scale.y = blink);
        m.head.position.y = m.headY + Math.sin(time * 2 + r.phase) * .03 - (t.asleep ? .2 : 0);
        m.head.position.x = m.headX - (t.asleep ? .12 : 0);
        m.head.rotation.y = t.asleep ? 0 : Math.sin(time * .7 + r.phase) * .25;   // 두리번두리번
      }
      if (r.drag) {
        pos.y += (.9 + Math.sin(time * 5) * .06 - pos.y) * Math.min(1, dt * 10);   // 공중에 둥실
      } else if (r.hop > 0) {
        r.hop -= dt * 2.2;
        pos.y = m.egg ? 0 : Math.abs(Math.sin(r.hop * Math.PI)) * .5;
        if (r.hop <= 0) { r.hop = 0; pos.y = 0; }
      } else pos.y += (0 - pos.y) * Math.min(1, dt * 10);
      // 그네 타는 중: 그네 의자에 앉아서 같이 흔들려요
      if (r.riding && !viewTrip && !viewRoom) {
        const sw = swingObj();
        if (!sw || t.asleep || t.trip) endRide(t, true);
        else {
          sw.userData.board.getWorldPosition(pos);
          pos.y += .03;
          // 앞을 보고 앉아서, 그네가 흔들리는 대로 앞뒤로 기울어요
          r.root.rotation.set(0, sw.rotation.y - Math.PI / 2, -sw.userData.seat.rotation.x);
          t.happy = clamp(t.happy + dt * .5);
          r.riding.left -= dt;
          if (r.riding.left <= 0) endRide(t);
        }
      }
      // 침실에서는 자기 침대 위에 누워서 자요 (머리는 베개 쪽)
      if (viewRoom) {
        const b = bedSpot(t);
        pos.set(b[0] - Math.sin(b[2]) * .15, .47 + b[3], b[1] - Math.cos(b[2]) * .15);   // 베개 쪽으로 살짝
        r.root.rotation.y = b[2] + Math.PI / 2;   // 머리는 베개 쪽
        r.target = null;
      }
      // 이름표·말풍선
      const tp = toScreen(v.copy(pos).setY(-.15));
      r.tag.style.left = tp.x + 'px';
      r.tag.style.top = (tp.y + 6) + 'px';
      const hp = headScreen(t);
      r.bubble.style.left = hp.x + 'px';
      r.bubble.style.top = hp.y + 'px';
      if (r.say > 0 && (r.say -= dt) <= 0) r.bubble.classList.remove('show');
      if (t.asleep && Math.random() < dt * .8) {
        const z = document.createElement('div');
        z.className = 'zzz';
        z.textContent = 'z';
        z.style.left = hp.x + 'px';
        z.style.top = hp.y + 'px';
        sceneEl.appendChild(z);
        z.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: 'translate(14px,-40px)', opacity: 0 }], { duration: 1800 }).onfinish = () => z.remove();
      }
    });
    const t = cur(), r = t && rt[t.id];
    ring.visible = !!r && r.root.visible;
    if (r) {
      ring.position.set(r.root.position.x, .03, r.root.position.z);
      ring.scale.setScalar(r.size * (1 + Math.sin(time * 3) * .06));
    }
    // 고른 거북이가 자면 밤
    nightK += ((t && t.asleep ? 1 : 0) - nightK) * Math.min(1, dt * 1.5);
  }
  // 하늘색과 빛: 여행지면 그곳 분위기, 섬이면 낮/밤
  const lk = Math.min(1, dt * 3);
  const bgWant = viewDest ? viewDest.bg : DAY_BG.clone().lerp(NIGHT_BG, nightK);
  scene.background.lerp(bgWant, lk);
  scene.fog.color.copy(scene.background);
  hemi.intensity += ((viewDest ? viewDest.hemi : 1.3 - nightK * .8) - hemi.intensity) * lk;
  sun.intensity += ((viewDest ? viewDest.sun : 2.2 - nightK * 1.6) - sun.intensity) * lk;

  for (let k = effects.length - 1; k >= 0; k--) {
    const f = effects[k];
    f.t += dt;
    if (f.kind === 'bubble') { f.m.position.y += dt * .8; f.m.material.opacity = Math.max(0, .85 - f.t * .5); }
    else { f.m.position.y = Math.max(.08, 1.5 - f.t * 4); if (f.t > .8) f.m.scale.multiplyScalar(1 - dt * 1.8); }
    if (f.t > 1.8) { scene.remove(f.m); effects.splice(k, 1); }
  }
  decor.forEach(f => f(time, dt));
  if (game && !press && performance.now() - lastCamTouch > AUTO_CAM_DELAY) autoFrame(dt);
  controls.update();
  renderer.render(scene, camera);
}

const K_STEPS = [
  { id: 'wash', name: '🚿 씻기' }, { id: 'cut', name: '🔪 썰기' }, { id: 'add', name: '🥄 넣기' },
  { id: 'cook', name: '🔥 요리' }, { id: 'season', name: '🧂 양념' }, { id: 'plate', name: '🍽️ 담기' },
];
let kIdx = 0, kTimer = null, kSeason = [];
const kStage = () => $('kStage');
const curMethod = () => METHODS.find(x => x.id === kMethod);
const kPicked = () => { const items = kitchenItems(); return kPicks.map(id => items.find(i => i.id === id)); };
function kSize() { const r = kStage().getBoundingClientRect(); return { w: r.width, h: r.height }; }
function kLocal(e) { const r = kStage().getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
// 요리판 위에 그림(이모지)을 놓아요
function kSpawn(html, x, y, cls = 'k-item') {
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  kStage().appendChild(d);
  return d;
}
function kPuff(emoji, x, y) { const d = kSpawn(emoji, x, y, 'k-puff'); setTimeout(() => d.remove(), 900); }
function kClear() {
  const st = kStage();
  st.onpointerdown = st.onpointermove = st.onpointerup = null;
  clearInterval(kTimer);
}
function kGo(i) {
  kIdx = i;
  $('kSteps').innerHTML = K_STEPS.map((s, k) => `<span class="${k < i ? 'done' : k === i ? 'on' : ''}">${s.name}</span>`).join('');
  kClear();
  kStage().innerHTML = '';
  K_FNS[K_STEPS[i].id]();
}
let kBusy = false;
function kStepDone(msg) {
  if (kBusy) return;
  kBusy = true;
  kClear();
  $('kInstr').textContent = msg;
  Sound.play('twinkle');
  setTimeout(() => { kBusy = false; kIdx + 1 < K_STEPS.length ? kGo(kIdx + 1) : finishDish(); }, 1100);
}

const K_FNS = {
  // 🚿 재료 위를 문질러서 씻어요
  wash() {
    $('kInstr').textContent = '재료 위를 마우스로 문질문질 씻어요! 🫧';
    const { w, h } = kSize();
    kSpawn('🚿', w / 2, 30, 'k-item small');
    kSpawn('', w / 2, 52, 'k-water');
    const its = kPicked().map((p, i, a) => {
      const x = w * (i + 1) / (a.length + 1), y = h * .68;
      return { d: kSpawn(p.emoji, x, y), bar: kSpawn('<i></i>', x, y + 38, 'k-bar'), v: 0, x, y };
    });
    let last = null;
    kStage().onpointermove = e => {
      const p = kLocal(e);
      if (last) {
        const dist = Math.hypot(p.x - last.x, p.y - last.y);
        its.forEach(it => {
          if (it.v >= 100 || Math.hypot(p.x - it.x, p.y - it.y) > 42) return;
          it.v = Math.min(100, it.v + dist * .4);
          it.bar.firstChild.style.width = it.v + '%';
          if (Math.random() < .15) kPuff('🫧', p.x, p.y);
          if (it.v >= 100) {
            it.d.classList.add('clean');
            kPuff('✨', it.x, it.y - 34);
            Sound.play('clink');
            if (its.every(o => o.v >= 100)) kStepDone('반짝반짝 깨끗해졌어요! ✨');
          }
        });
      }
      last = p;
    };
  },
  // 🔪 재료를 눌러서 송송 썰어요 (재료마다 3번)
  cut() {
    $('kInstr').textContent = '재료를 톡톡 눌러서 송송 썰어요! 🔪 (재료마다 3번)';
    const { w, h } = kSize();
    kSpawn('', w / 2, h * .62, 'k-board');
    const knife = kSpawn('🔪', w * .8, h * .3, 'k-item knife');
    const list = kPicked();
    let idx = 0, chops = 0, food = null;
    const show = () => {
      if (food) food.remove();
      const e = list[idx].emoji;
      food = kSpawn(Array(chops + 1).fill(e).map(x => `<span style="font-size:${chops ? 30 : 54}px;margin:0 ${chops * 3}px">${x}</span>`).join(''), w / 2, h * .6, 'k-item cuttable');
    };
    show();
    kStage().onpointermove = e => { const p = kLocal(e); knife.style.left = p.x + 22 + 'px'; knife.style.top = p.y - 26 + 'px'; };
    kStage().onpointerdown = e => {
      if (!e.target.closest('.cuttable')) return;
      knife.classList.remove('chop'); void knife.offsetWidth; knife.classList.add('chop');
      Sound.play('thump');
      chops++;
      if (chops < 3) return show();
      kSpawn(list[idx].emoji, 26 + idx * 36, 24, 'k-item small');   // 다 썬 재료는 위쪽에
      idx++;
      chops = 0;
      if (idx < list.length) show();
      else { food.remove(); kStepDone('송송 다 썰었어요! 🔪'); }
    };
  },
  // 🥄 썬 재료를 끌어서 냄비에 넣어요
  add() {
    $('kInstr').textContent = '썬 재료를 끌어서 냄비에 쏙 넣어요! 🥄';
    const { w, h } = kSize();
    const px = w * .7, py = h * .58;
    const pot = kSpawn(curMethod().tool, px, py, 'k-item huge');
    const piles = kPicked().map((p, i, a) => {
      const x = w * .2, y = h * (i + 1) / (a.length + 1);
      const d = kSpawn(p.emoji.repeat(3), x, y, 'k-item pile');
      d.dataset.x = x; d.dataset.y = y;
      return d;
    });
    let drag = null, inPot = 0;
    kStage().onpointerdown = e => { const d = e.target.closest('.pile'); if (d) { drag = d; kStage().setPointerCapture(e.pointerId); } };
    kStage().onpointermove = e => { if (!drag) return; const p = kLocal(e); drag.style.left = p.x + 'px'; drag.style.top = p.y + 'px'; };
    kStage().onpointerup = e => {
      if (!drag) return;
      const p = kLocal(e);
      if (Math.hypot(p.x - px, p.y - py) < 70) {
        drag.remove();
        inPot++;
        Sound.play('plop');
        kPuff('💦', px, py - 40);
        pot.classList.remove('wob'); void pot.offsetWidth; pot.classList.add('wob');
        if (inPot >= piles.length) kStepDone('재료를 다 넣었어요! 🥄');
      } else { drag.style.left = drag.dataset.x + 'px'; drag.style.top = drag.dataset.y + 'px'; }
      drag = null;
    };
  },
  // 🔥 요리하기 (수프: 젓기 · 구이: 뒤집기 · 샐러드: 흔들기)
  cook() {
    const m = curMethod();
    const { w, h } = kSize();
    const cx = w / 2, cy = h * .6;
    const pot = kSpawn(m.tool, cx, cy, 'k-item huge');
    const inside = kSpawn(kPicked().map(p => p.emoji).join(''), cx, cy - 8, 'k-item mini');
    if (m.id === 'soup') {
      $('kInstr').textContent = '숟가락으로 냄비 안을 빙글빙글 저어요! 🥄 (0/3바퀴)';
      const spoon = kSpawn('🥄', cx + 40, cy - 30, 'k-item mini');
      spoon.style.fontSize = '38px';
      let prev = null, total = 0;
      kTimer = setInterval(() => kPuff('🫧', cx + (Math.random() - .5) * 70, cy - 30), 450);
      kStage().onpointermove = e => {
        const p = kLocal(e);
        spoon.style.left = p.x + 'px'; spoon.style.top = p.y + 'px';
        const a = Math.atan2(p.y - cy, p.x - cx);
        if (prev != null && Math.hypot(p.x - cx, p.y - cy) < 120) {
          let d = a - prev;
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          total += d;
          inside.style.transform = `translate(-50%, -50%) rotate(${total}rad)`;
          const turns = Math.min(3, Math.floor(Math.abs(total) / (Math.PI * 2)));
          $('kInstr').textContent = `숟가락으로 냄비 안을 빙글빙글 저어요! 🥄 (${turns}/3바퀴)`;
          if (turns >= 3) kStepDone('보글보글 맛있게 끓었어요! 🍲');
        }
        prev = a;
      };
    } else if (m.id === 'grill') {
      $('kInstr').textContent = "지글지글! 막대가 노란 칸에 오면 '뒤집기!'를 눌러요 (0/2)";
      const bar = kSpawn('<b></b>', cx, h * .14, 'k-heat');
      const btn = kSpawn('<button>뒤집기!</button>', cx, h * .9, 'k-btn');
      let v = 0, ok = 0;
      kTimer = setInterval(() => {
        v = (v + 2.2) % 100;
        bar.firstChild.style.left = v + '%';
        if (Math.random() < .15) kPuff('💨', cx + (Math.random() - .5) * 60, cy - 40);
      }, 40);
      btn.querySelector('button').onclick = () => {
        if (v >= 45 && v <= 80) {
          ok++;
          Sound.play('sizzle');
          inside.classList.remove('flip'); void inside.offsetWidth; inside.classList.add('flip');
          kPuff('😋', cx, cy - 60);
          $('kInstr').textContent = `완벽해요! 노릇노릇 (${ok}/2)`;
          if (ok >= 2) kStepDone('노릇노릇 맛있게 구워졌어요! 🍢');
        } else $('kInstr').textContent = v < 45 ? '앗, 아직 덜 익었어요! 노란 칸까지 기다려요' : '앗, 조금 늦었어요! 다시 해 봐요';
      };
    } else {
      $('kInstr').textContent = '그릇을 좌우로 흔들어서 섞어요! (0/6)';
      let dir = 0, last = null, n = 0;
      kStage().onpointermove = e => {
        const p = kLocal(e);
        const x = Math.max(60, Math.min(w - 60, p.x));
        pot.style.left = x + 'px'; inside.style.left = x + 'px';
        if (last != null && Math.abs(p.x - last) > 3) {
          const d = Math.sign(p.x - last);
          if (d !== dir) {
            if (dir) {
              n++;
              Sound.play('flutter');
              if (Math.random() < .5) kPuff('🥗', x, cy - 50);
              $('kInstr').textContent = `그릇을 좌우로 흔들어서 섞어요! (${Math.min(6, n)}/6)`;
              if (n >= 6) kStepDone('골고루 잘 섞였어요! 🥗');
            }
            dir = d;
          }
        }
        last = p.x;
      };
    }
  },
  // 🧂 양념을 골라서 톡톡 뿌려요 (3번)
  season() {
    $('kInstr').textContent = '양념을 골라서 톡톡 뿌려요! (0/3)';
    const { w, h } = kSize();
    const cx = w / 2, cy = h * .66;
    kSpawn(curMethod().tool, cx, cy, 'k-item huge');
    kSeason = [];
    [['🧂', '소금', { hunger: 2 }], ['🍯', '꿀', { happy: 3 }], ['🌿', '허브', { health: 3 }]].forEach(([e, name, eff], i) => {
      const b = kSpawn(`<button>${e}<small>${name}</small></button>`, w * (i + 1) / 4, 44, 'k-btn shaker');
      b.querySelector('button').onclick = () => {
        if (kSeason.length >= 3) return;
        kSeason.push(eff);
        Sound.play('twinkle');
        for (let k = 0; k < 5; k++) setTimeout(() => kPuff(e, cx + (Math.random() - .5) * 60, cy - 50), k * 80);
        $('kInstr').textContent = `${name} 톡톡! (${kSeason.length}/3)`;
        if (kSeason.length >= 3) kStepDone('음~ 맛있는 냄새가 나요! 😋');
      };
    });
  },
  // 🍽️ 다 된 요리를 끌어서 접시에 담아요
  plate() {
    $('kInstr').textContent = '다 된 요리를 끌어서 접시에 담아요! 🍽️';
    const { w, h } = kSize();
    const m = curMethod();
    const dx = w * .25, dy = h * .55, px = w * .72, py = h * .62;
    const plate = kSpawn('🍽️', px, py, 'k-item huge');
    plate.style.cursor = 'default';
    const dish = kSpawn(m.emoji, dx, dy, 'k-item huge pile');
    let drag = false;
    kStage().onpointerdown = e => { if (e.target.closest('.pile')) { drag = true; kStage().setPointerCapture(e.pointerId); } };
    kStage().onpointermove = e => { if (!drag) return; const p = kLocal(e); dish.style.left = p.x + 'px'; dish.style.top = p.y + 'px'; };
    kStage().onpointerup = e => {
      if (!drag) return;
      drag = false;
      const p = kLocal(e);
      if (Math.hypot(p.x - px, p.y - py) < 80) {
        dish.style.left = px + 'px'; dish.style.top = (py - 18) + 'px';
        dish.style.fontSize = '60px';
        Sound.play('win');
        kStepDone('짜잔! 예쁘게 담았어요! 🍽️');
      } else { dish.style.left = dx + 'px'; dish.style.top = dy + 'px'; }
    };
  },
};

$('kStart').onclick = () => {
  $('kPick').hidden = true;
  $('kCook').hidden = false;
  kGo(0);
};
// 요리 완성! 이름과 효과 정하기
function finishDish() {
  const m = curMethod();
  const picked = kPicked();
  const unique = [...new Set(kPicks)];
  const name = unique.length >= 3 ? `모둠 ${m.name}` : `${picked[0].name} ${m.name}`;
  const eff = {};
  picked.forEach(p => Object.entries(p.eff).forEach(([k, v]) => eff[k] = (eff[k] || 0) + v));
  Object.entries(m.bonus).forEach(([k, v]) => eff[k] = (eff[k] || 0) + v);
  kSeason.forEach(s => Object.entries(s).forEach(([k, v]) => eff[k] = (eff[k] || 0) + v));   // 양념 효과
  kDishInfo = { emoji: m.emoji, name, eff, bagUsed: kPicks.filter(id => !INGREDIENTS.some(i => i.id === id)) };
  $('kCook').hidden = true;
  $('kDone').hidden = false;
  $('kDish').textContent = m.emoji;
  $('kDishName').textContent = `짜잔! ${name} 완성!`;
  $('kDishEff').textContent = effText(eff);
  Sound.play('win');
}
$('kCancel').addEventListener('click', kClear);
$('kQuit').onclick = () => { kClear(); $('kitchenOverlay').classList.remove('open'); };

$('kServe').onclick = () => {
  $('kitchenOverlay').classList.remove('open');
  const t = cur();
  if (!t || !kDishInfo) return;
  const d = kDishInfo;
  d.bagUsed.forEach(id => { game.bag[id]--; if (game.bag[id] <= 0) delete game.bag[id]; });   // 가방 재료는 써서 없어져요
  Object.entries(d.eff).forEach(([k, v]) => t[k] = clamp(t[k] + v));
  if (t.nextPoop == null) t.nextPoop = rand(40, 90);
  const r = rt[t.id];
  if (r) { r.target = null; r.wait = 2.5; r.hop = 1; }
  dropFood(t, 'berry');
  float(t, d.emoji, 3);
  Sound.play('eat');
  say(t, `냠냠 ${d.emoji} ${d.name} 최고예요! 💕`, 3);
  award(2);
  log(`🍳 ${t.name}에게 ${josa(d.name, '을', '를')} 요리해 줬어요! (${effText(d.eff)})`);
  kDishInfo = null;
  renderFoodMenu();
  render();
  save();
};
$('foodMenu').addEventListener('click', e => { const b = e.target.closest('[data-food]'); if (b) feed(b.dataset.food); });
// 기본 먹이 3가지 + 🎒 가방 속 과일·간식
function renderFoodMenu() {
  if (!game) return;
  const base = Object.entries(FOODS).map(([k, f]) => `<button data-food="${k}">${f.emoji} ${f.name}<small>배 +${f.hunger}${f.happy ? ' · 기분 +' + f.happy : ''}</small></button>`);
  const bag = Object.entries(game.bag).filter(([, n]) => n > 0).map(([k, n]) => {
    const s = shopItem(k);
    return s && !s.med ? `<button data-food="${k}" class="bag">${s.emoji} ${s.name} ×${n}<small>${effText(s.eff)}</small></button>` : '';
  });
  $('foodMenu').innerHTML = base.concat(bag).join('');
}
$('shopBtn').onclick = openShop;
$('shopClose').onclick = () => $('shopOverlay').classList.remove('open');
$('shopTabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { shopCat = b.dataset.cat; renderShop(); } });
$('shopList').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.buy) buy(b.dataset.buy);

});

// =====================================================================
// 💊 약 상자: 🩺 진찰 결과를 보고 맞는 약을 골라 줘요
// =====================================================================
const MED_FOR = { cold: 'med_cold', tummy: 'med_tummy', fever: 'med_fever' };
function openMedBox() {
  const t = canAct();
  if (!t) return;
  if (t.asleep) return say(t, '쿨쿨… 💤');
  renderMedBox();
  $('medOverlay').classList.add('open');
}
function renderMedBox() {
  const t = cur();
  if (!t) return;
  $('medTitle').textContent = `💊 ${t.name}의 약 상자`;
  // 🩺 진찰 결과
  if (t.sick) {
    const need = shopItem(MED_FOR[t.sick] || 'med_fever');
    $('medDiag').innerHTML = `🩺 진찰 결과: ${ill(t).emoji} <b>${ill(t).name}</b>에 걸렸어요<small>👉 ${need.emoji} ${josa(need.name, '이', '가')} 필요해요 (✨ 만병통치약도 돼요)</small>`;
  } else if (t.energy < 30) {
    $('medDiag').innerHTML = `🩺 진찰 결과: 😪 많이 <b>피곤해요</b><small>👉 ⚡ 기운 쑥쑥 약을 먹으면 힘이 나요</small>`;
  } else {
    $('medDiag').innerHTML = `🩺 진찰 결과: 😊 <b>건강해요!</b><small>💖 비타민이나 ⚡ 기운 쑥쑥 약은 먹어도 돼요</small>`;
  }
  const meds = SHOP.filter(s => s.med && game.bag[s.id] > 0);
  $('medList').innerHTML = meds.length
    ? meds.map(s => `<button data-med="${s.id}"><span class="e">${s.emoji}</span>${s.name} ×${game.bag[s.id]}</button>`).join('')
    : '<div class="med-empty">약이 하나도 없어요! 🛒 약국에서 사 오세요</div>';
}
function giveMed(id) {
  const t = cur(), s = shopItem(id);
  if (!t || !s || !(game.bag[id] > 0)) return;
  const use = () => { game.bag[id]--; if (game.bag[id] <= 0) delete game.bag[id]; };
  if (s.med === 'vitamin' || s.med === 'power') {
    use();
    if (s.med === 'vitamin') { t.health = clamp(t.health + 15); t.energy = clamp(t.energy + 10); }
    else { t.energy = clamp(t.energy + 40); t.happy = clamp(t.happy + 5); }
    Sound.play('heal');
    float(t, s.emoji, 3);
    say(t, s.med === 'power' ? '기운이 쑥쑥 나요! ⚡💪' : '튼튼해지는 느낌이에요! 💖', 2.5);
    log(`${s.emoji} ${t.name}에게 ${josa(s.name, '을', '를')} 줬어요.`);
  } else if (!t.sick) {
    say(t, '안 아픈데요? 😖', 2);   // 아프지 않으면 약을 아껴요
    Sound.play('full');
    return;
  } else if (s.med === 'all' || MED_FOR[t.sick] === id) {
    use();
    const name = ill(t).name;
    t.sick = false;
    t.health = clamp(t.health + 20);
    Sound.play('heal');
    float(t, '✨', 3);
    say(t, '다 나았어요! 고마워요 💕', 3);
    award(1);
    log(`${s.emoji} ${josa(s.name, '을', '를')} 먹고 ${josa(t.name, '이', '가')} ${josa(name, '이', '가')} 나았어요! 🎉`);
  } else {
    say(t, '이 약이 아니에요… 🤔', 2);   // 틀린 약은 없어지지 않아요
    Sound.play('full');
    log(`🩺 이 약이 아니에요! 진찰 결과를 다시 보세요. ${ill(t).emoji} ${ill(t).name}에는 ${josa(shopItem(MED_FOR[t.sick]).name, '이', '가')} 필요해요.`);
    return renderMedBox();
  }
  $('medOverlay').classList.remove('open');
  render();
  save();
}
$('medList').addEventListener('click', e => { const b = e.target.closest('[data-med]'); if (b) giveMed(b.dataset.med); });
$('medClose').onclick = () => $('medOverlay').classList.remove('open');

$('tripBtn').onclick = openTrip;
$('tripCancel').onclick = () => $('tripOverlay').classList.remove('open');
let tripPick = new Set();
$('tripMates').addEventListener('click', e => {
  const b = e.target.closest('[data-mate]');
  if (!b || b.disabled) return;
  const id = +b.dataset.mate;
  if (tripPick.has(id)) tripPick.delete(id); else tripPick.add(id);
  b.classList.toggle('on', tripPick.has(id));
});
$('tripList').addEventListener('click', e => {
  const b = e.target.closest('[data-trip]');
  const t = cur();
  if (!b) return;
  $('tripOverlay').classList.remove('open');
  if (!t || t.trip) return;
  const list = [t, ...game.turtles.filter(x => x.id !== t.id && tripPick.has(x.id) && travelOk(x) === 'ok')];
  startTrip(list, b.dataset.trip, true);   // 여행은 항상 나도 같이 가요
});
// 섬으로 돌아가면 같이 간 거북이들도 다 함께 돌아와요
function endTrip() {
  const mates = viewMates();
  if (mates.length) comeHome(mates[0]);
  else exitTrip();
}
$('tripHome').onclick = endTrip;
$('actBtn').onclick = openActMenu;
$('actMenu').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) startActivity(b.dataset.act); });
$('actTap').onclick = actTap;

// 소리 켜기/끄기
function renderToggles() {
  $('musicBtn').classList.toggle('off', !game.settings.music);
  $('sfxBtn').classList.toggle('off', !game.settings.sfx);
  $('sfxBtn').textContent = game.settings.sfx ? '🔊' : '🔇';
}
$('musicBtn').onclick = () => {
  game.settings.music = !game.settings.music;
  Sound.init();
  Sound.update();
  renderToggles();
  log(game.settings.music ? '🎵 배경음악을 켰어요.' : '배경음악을 껐어요.');
  save();
};
$('sfxBtn').onclick = () => {
  game.settings.sfx = !game.settings.sfx;
  Sound.init();
  Sound.play('click');
  renderToggles();
  save();
};
// 브라우저는 화면을 한 번 눌러야 소리를 낼 수 있어요
document.addEventListener('pointerdown', () => Sound.init());
document.addEventListener('click', e => {
  if (e.target.closest('.actions button, .food button, .overlay button')) Sound.play('click');
});
window.addEventListener('pagehide', () => save(true));
// 인터넷 주소(https)로 열었을 때: 게임 파일을 아이패드에 저장해 두고 오프라인에서도 열리게 해요
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeunload', () => save(true));
window.addEventListener('blur', () => Sound.setAudible(false));
window.addEventListener('focus', () => Sound.setAudible(watching()));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// =====================================================================
// 시작
// =====================================================================
frame();
(async () => {
  game = normalize(await load()) || emptyGame();
  renderToggles();
  renderSouvenirs();
  renderDecos();
  renderFoodMenu();
  renderCoins();
  if (!game.turtles.length) {
    render();
    openStart();
  } else {
    // 게임을 꺼 둔 동안은 시간이 멈춰요. 다시 켜면 끄기 전 그대로 이어서 해요.
    const away = (Date.now() - game.lastSaved) / 1000;
    // (예전에는 여기서 꺼 둔 시간만큼 배고파지게 했어요. 이제는 안 해요.)
    if (!cur()) game.cur = game.turtles[0].id;
    game.turtles.forEach(createPet);
    renderPoops();
    renderSouvenirs();
    render();
    if (away > 60) log('⏸️ 꺼 둔 동안 시간이 멈춰 있었어요. 거북이들이 그대로 기다리고 있었어요! 🐢');
    else log('이어서 키워요! 🐢');
    // 여행 중이었으면 여행지에서 이어서 해요
    const traveler = game.turtles.find(t => t.trip);
    if (traveler) enterTrip(traveler.trip.group);
  }
  save();
  setInterval(loop, 1000);
  setInterval(save, 2000);   // 2초마다 저장 (서버가 갑자기 꺼져도 거의 다 남아요)
})();
</script>
</body>
</html>
